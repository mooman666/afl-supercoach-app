<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFL SuperCoach AI</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b0b0b;
  color:white;
}

header {
  background:#00c46a;
  padding:16px;
  font-size:20px;
  font-weight:bold;
  text-align:center;
}

.container {
  padding:12px;
}

.card {
  background:#1a1a1a;
  margin:12px 0;
  padding:15px;
  border-radius:12px;
  border:1px solid #222;
}

h3 {
  margin-top:0;
}

input {
  width:92%;
  padding:12px;
  margin:6px 0;
  border-radius:8px;
  border:none;
}

button {
  width:100%;
  padding:12px;
  margin-top:8px;
  background:#00c46a;
  border:none;
  border-radius:8px;
  font-weight:bold;
}

ul {
  list-style:none;
  padding:0;
}

li {
  padding:6px 0;
  border-bottom:1px solid #333;
}

.tag {
  display:inline-block;
  padding:4px 8px;
  margin-top:6px;
  border-radius:6px;
  font-size:12px;
  background:#333;
}
</style>
</head>

<body>

<header>🏉 AFL SuperCoach AI Dashboard</header>

<div class="container">

<!-- PLAYER ANALYSIS -->
<div class="card">
<h3>Player Analysis</h3>
<input id="player" placeholder="neale, cripps, gawn">
<button onclick="analyse()">Analyse Player</button>
<p id="result"></p>
</div>

<!-- SQUAD -->
<div class="card">
<h3>Your Squad</h3>
<input id="squadInput" placeholder="add player">
<button onclick="addPlayer()">Add Player</button>
<ul id="squadList"></ul>
</div>

<!-- CAPTAIN COMPARE -->
<div class="card">
<h3>Captain Compare</h3>
<input id="p1" placeholder="player 1">
<input id="p2" placeholder="player 2">
<button onclick="compare()">Compare</button>
<p id="compareResult"></p>
</div>

</div>

<script>

// ---------------- PLAYER DATA ----------------
const players = {
  neale: { avg: 121, pos: "MID", form: [118, 123, 120] },
  cripps: { avg: 115, pos: "MID", form: [110, 117, 118] },
  gawn: { avg: 108, pos: "RUC", form: [105, 112, 107] },
  brayshaw: { avg: 112, pos: "MID", form: [109, 113, 114] },
  serong: { avg: 110, pos: "MID", form: [108, 111, 112] },
  bontempelli: { avg: 118, pos: "MID/FWD", form: [116, 119, 120] },
  dawson: { avg: 109, pos: "DEF", form: [107, 110, 111] },
  rowell: { avg: 106, pos: "MID", form: [104, 108, 106] },
  mills: { avg: 111, pos: "DEF", form: [109, 112, 113] }
};

let squad = [];

// ---------------- PLAYER ANALYSIS ----------------
function analyse() {
  let p = document.getElementById("player").value.toLowerCase();
  let data = players[p];

  if (!data) {
    document.getElementById("result").innerHTML = "❌ No data found";
    return;
  }

  let score = data.avg;
  let trend = data.form[data.form.length - 1] - data.form[0];

  let tag = "";

  if (score >= 120) tag = "🔥 ELITE CAPTAIN";
  else if (score >= 110 && trend > 0) tag = "📈 FORM PICK";
  else if (score < 105) tag = "⚠️ TRADE OUT";
  else tag = "✔ SOLID HOLD";

  document.getElementById("result").innerHTML =
    `<b>${p.toUpperCase()}</b><br>
    Position: ${data.pos}<br>
    Avg: ${score}<br>
    Trend: ${trend > 0 ? "📈 Rising" : "📉 Falling"}<br>
    <span class="tag">${tag}</span>`;
}

// ---------------- SQUAD ----------------
function addPlayer() {
  let p = document.getElementById("squadInput").value.toLowerCase();
  if (!players[p]) return;

  squad.push(p);
  renderSquad();
}

function renderSquad() {
  let list = document.getElementById("squadList");
  list.innerHTML = "";

  squad.forEach(p => {
    let d = players[p];
    let li = document.createElement("li");
    li.innerHTML = `🏉 <b>${p.toUpperCase()}</b> (${d.pos}) - Avg ${d.avg}`;
    list.appendChild(li);
  });
}

// ---------------- CAPTAIN COMPARE ----------------
function compare() {
  let a = document.getElementById("p1").value.toLowerCase();
  let b = document.getElementById("p2").value.toLowerCase();

  if (!players[a] || !players[b]) {
    document.getElementById("compareResult").innerText = "Player not found";
    return;
  }

  let winner = players[a].avg > players[b].avg ? a : b;

  document.getElementById("compareResult").innerHTML =
    `${a.toUpperCase()}: ${players[a].avg}<br>
     ${b.toUpperCase()}: ${players[b].avg}<br><br>
     🏆 Best Captain: <b>${winner.toUpperCase()}</b>`;
}

</script>


</script>

</body>
</html>
