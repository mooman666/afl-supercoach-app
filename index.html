<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFL SuperCoach Pro</title>

<style>
body { margin:0; font-family: Arial; background:#0b0b0b; color:white; }

header {
  background:#00c46a;
  padding:16px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

.container { padding:12px; }

.nav {
  display:flex;
  gap:6px;
  margin-bottom:10px;
}

.nav button {
  flex:1;
  padding:10px;
  background:#222;
  border:none;
  color:white;
  border-radius:8px;
}

.card {
  background:#1a1a1a;
  margin:10px 0;
  padding:14px;
  border-radius:12px;
}

input {
  width:92%;
  padding:12px;
  margin:6px 0;
  border-radius:8px;
  border:none;
}

button {
  width:100%;
  padding:12px;
  margin-top:8px;
  background:#00c46a;
  border:none;
  border-radius:8px;
  font-weight:bold;
}

ul { list-style:none; padding:0; }
li { padding:6px; border-bottom:1px solid #333; }

.section { display:none; }
.active { display:block; }
</style>
</head>

<body>

<header>🏉 AFL SuperCoach Pro</header>

<div class="container">

<div class="nav">
<button onclick="show('analysis')">Analysis</button>
<button onclick="show('squad')">Squad</button>
<button onclick="show('trade')">Trades</button>
<button onclick="show('news')">News</button>
</div>

<!-- ANALYSIS -->
<div id="analysis" class="section active card">
<h3>Player Analysis</h3>
<input id="player" placeholder="neale, cripps, gawn">
<button onclick="analyse()">Analyse</button>
<p id="result"></p>
</div>

<!-- SQUAD -->
<div id="squad" class="section card">
<h3>Your Squad</h3>
<input id="squadInput" placeholder="add player">
<button onclick="addPlayer()">Add</button>
<ul id="squadList"></ul>
</div>

<!-- TRADE -->
<div id="trade" class="section card">
<h3>Trade Assistant</h3>
<input id="tradeInput" placeholder="player name">
<button onclick="trade()">Get Advice</button>
<p id="tradeResult"></p>
</div>

<!-- NEWS -->
<div id="news" class="section card">
<h3>Insights Feed</h3>
<div id="feed"></div>
</div>

</div>

<script src="players.js"></script>
<script src="app.js"></script>

</body>
</html>
