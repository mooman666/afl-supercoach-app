<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARCHITECT v30 // TOTAL LEAGUE</title>
    <style>
        :root { --primary: #38bdf8; --success: #10b981; --danger: #ef4444; --bg: #020617; --card: #1e293b; --nav: #0f172a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'JetBrains Mono', monospace; }
        body { background: var(--bg); color: #f1f5f9; padding-bottom: 90px; }
        
        /* Persistent Navigation */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--nav); display: flex; padding: 12px 0; border-top: 1px solid #334155; z-index: 1000; }
        .nav-item { color: #64748b; font-size: 10px; text-align: center; flex: 1; cursor: pointer; }
        .nav-item.active { color: var(--primary); text-shadow: 0 0 10px var(--primary); }
        
        /* Screens */
        .screen { display: none; padding: 15px; animation: fadeIn 0.2s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Search & Lists */
        .search-box { position: sticky; top: 0; background: var(--bg); padding: 10px 0; z-index: 100; }
        #mainSearch { width: 100%; background: #0f172a; border: 1px solid var(--primary); padding: 14px; border-radius: 10px; color: white; outline: none; }
        .player-card { background: var(--card); border-radius: 10px; padding: 12px; margin-bottom: 8px; border: 1px solid #334155; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        
        /* Modals */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: var(--card); width: 100%; max-width: 400px; border-radius: 15px; padding: 25px; border: 1px solid var(--primary); }
        
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #0f172a; padding: 15px; border-radius: 10px; margin-top: 15px; }
    </style>
</head>
<body>

<div id="market" class="screen active">
    <div class="search-box">
        <input type="text" id="mainSearch" placeholder="SEARCH ALL 18 TEAMS (e.g. Suns MID)...">
    </div>
    <div id="marketList"></div>
</div>

<div id="trade" class="screen">
    <h2 style="margin-bottom:20px;">TRADE ARCHITECT</h2>
    <div class="trade-slots" style="text-align:center;">
        <div id="slotOut" onclick="setTradeMode('OUT')" style="border:1px dashed var(--danger); padding:20px; border-radius:12px; margin-bottom:10px;">SELECT PLAYER OUT</div>
        <div id="slotIn" onclick="setTradeMode('IN')" style="border:1px dashed var(--success); padding:20px; border-radius:12px;">SELECT PLAYER IN</div>
        <div id="bank" style="margin-top:20px; font-size:28px; color:var(--success); font-weight:bold;">$0</div>
    </div>
</div>

<div id="pModal" class="modal" onclick="this.classList.remove('active')">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h2 id="mName" style="color:var(--primary)"></h2>
        <p id="mSub" style="color:#94a3b8; font-size:12px; margin-bottom:5px;"></p>
        <div class="stat-grid">
            <div><small>PRICE</small><br><strong id="mPrice"></strong></div>
            <div><small>AVG</small><br><strong id="mAvg"></strong></div>
            <div><small>BE</small><br><strong id="mBE"></strong></div>
            <div><small>PPD</small><br><strong id="mPPD" style="color:var(--success)"></strong></div>
        </div>
    </div>
</div>

<nav class="bottom-nav">
    <div class="nav-item active" onclick="nav('market', this)"><i>🔍</i>LIST</div>
    <div class="nav-item" onclick="nav('trade', this)"><i>🔄</i>TRADE</div>
</nav>

<script>
    // --- COMPRESSED LEAGUE REGISTRY ---
    // Format: Name|Team|Pos|Price|Avg|BE
    const data = [
        "Max Gawn|MEL|RUC|703700|130|185", "Nick Daicos|COL|MID|634000|122|133",
        "Harry Sheezel|NTH|DEF|611700|125|140", "Zak Butters|PTA|MID|639800|123|121",
        "Bontempelli|WBD|MID|648900|130|179", "Jai Serong|FRE|DEF|276100|76|-37",
        "Jacob Farrow|SYD|DEF|226800|80|-57", "Angus Anderson|COL|MID|113500|88|-75",
        "Elijah Tsatas|ESS|MID|223400|91|-49", "Milan Murdock|WCE|MID|199900|89|-57",
        "Tristan Xerri|NTH|RUC|687300|121|125", "Colby McKercher|NTH|DEF|471500|87|101",
        "Lachie Whitfield|GWS|DEF|547700|100|96", "Jordan Clark|FRE|DEF|529600|96|157",
        "Dan Houston|PTA|DEF|433500|89|102", "Sam Flanders|GCS|MID|559100|114|110",
        "Jack Sinclair|STK|DEF|593300|116|157", "Patrick Cripps|CAR|MID|588900|116|118"
    ];

    // Auto-generate deep bench for search
    const teams = ["ADL","BRI","CAR","COL","ESS","FRE","GEE","GCS","GWS","HAW","MEL","NTH","PTA","RIC","STK","SYD","WCE","WBD"];
    teams.forEach(t => {
        data.push(`${t} Captain|${t}|MID|610000|115|120`);
        data.push(`${t} Rookie A|${t}|FWD|119900|65|-15`);
        data.push(`${t} Rookie B|${t}|DEF|123500|68|-10`);
    });

    const roster = data.map(s => {
        const [n,t,p,pr,a,b] = s.split('|');
        return { name: n, team: t, pos: p, price: parseInt(pr), avg: parseInt(a), be: parseInt(b) };
    });

    let tradeState = { mode: null, out: null, in: null };

    function nav(id, el) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    }

    function render(list) {
        document.getElementById('marketList').innerHTML = list.map(p => `
            <div class="player-card" onclick="handleSelect('${p.name}')">
                <div><strong>${p.name}</strong><br><small style="color:#94a3b8">${p.team} | ${p.pos}</small></div>
                <div style="text-align:right"><div style="color:var(--success); font-weight:bold;">$${p.price.toLocaleString()}</div><small>BE: ${p.be}</small></div>
            </div>
        `).join('');
    }

    function handleSelect(name) {
        const p = roster.find(x => x.name === name);
        if (tradeState.mode) {
            if (tradeState.mode === 'OUT') tradeState.out = p; else tradeState.in = p;
            document.getElementById('slot' + (tradeState.mode === 'OUT' ? 'Out' : 'In')).innerText = p.name;
            if (tradeState.out && tradeState.in) document.getElementById('bank').innerText = "$" + (tradeState.out.price - tradeState.in.price).toLocaleString();
            tradeState.mode = null;
            nav('trade', document.querySelectorAll('.nav-item')[1]);
        } else {
            document.getElementById('mName').innerText = p.name;
            document.getElementById('mSub').innerText = `${p.team} • ${p.pos}`;
            document.getElementById('mPrice').innerText = "$" + p.price.toLocaleString();
            document.getElementById('mAvg').innerText = p.avg;
            document.getElementById('mBE').innerText = p.be;
            document.getElementById('mPPD').innerText = (p.avg / (p.price/100000)).toFixed(2);
            document.getElementById('pModal').classList.add('active');
        }
    }

    function setTradeMode(m) { tradeState.mode = m; nav('market', document.querySelectorAll('.nav-item')[0]); }

    document.getElementById('mainSearch').addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase();
        render(roster.filter(p => p.name.toLowerCase().includes(q) || p.team.toLowerCase().includes(q)));
    });

    window.onload = () => render(roster);
</script>
</body>
</html>
