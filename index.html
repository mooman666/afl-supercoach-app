<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AFL Fantasy Pro</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0f172a;
  color:white;
}

header {
  position:sticky;
  top:0;
  background:#111827;
  padding:10px;
  display:flex;
  gap:8px;
}

button {
  padding:8px 10px;
  border:none;
  border-radius:6px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}

input {
  padding:8px;
  border-radius:6px;
  border:none;
  flex:1;
}

#app { padding:12px; }

.card {
  background:#1f2937;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  cursor:pointer;
}

.elite { border-left:4px solid #22c55e; }
.premium { border-left:4px solid #3b82f6; }
.value { border-left:4px solid #f59e0b; }
.avoid { border-left:4px solid #ef4444; }

/* PROFILE MODAL */
#modal {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.85);
  display:none;
  overflow:auto;
}

.modal-content {
  background:#111827;
  margin:60px 10px;
  padding:15px;
  border-radius:12px;
}

img {
  width:100%;
  border-radius:10px;
}
</style>
</head>

<body>

<header>
<input placeholder="Search..." oninput="setSearch(this.value)" />
</header>

<div id="app">Loading...</div>

<div id="modal" onclick="closeProfile()">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div id="profile"></div>
    <button onclick="closeProfile()">Close</button>
  </div>
</div>

<script src="app.js"></script>

</body>
</html>
