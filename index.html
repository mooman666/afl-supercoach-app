<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARCHITECT v13 // DATABASE</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #38bdf8; --success: #00ff88; --danger: #ef4444; --warning: #facc15; --bg: #020617; --card: #1e293b; --nav: #0f172a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: #f1f5f9; padding-bottom: 90px; }

        /* SEARCH HEADER */
        .search-wrap { background: var(--nav); padding: 15px; border-bottom: 2px solid var(--primary); position: sticky; top: 0; z-index: 1000; }
        #playerSearch { width: 100%; background: #1e293b; border: 1px solid #334155; padding: 12px; border-radius: 8px; color: white; font-weight: 600; outline: none; }
        #playerSearch:focus { border-color: var(--primary); }

        /* NAV */
        nav { position: fixed; bottom: 0; width: 100%; display: flex; background: var(--nav); border-top: 1px solid #334155; z-index: 1000; padding: 10px; }
        nav button { flex: 1; background: none; border: none; color: #64748b; font-size: 10px; font-weight: 800; cursor: pointer; }
        nav button.active { color: var(--primary); }

        /* LIST & CARDS */
        .page { display: none; padding: 15px; }
        .page.active { display: block; }
        .player-card { background: var(--card); border-radius: 10px; padding: 15px; margin-bottom: 10px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .price-tag { font-family: monospace; color: var(--success); font-weight: bold; }
        
        /* MODAL STATS */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; padding: 20px; }
        .modal-content { background: var(--card); border-radius: 15px; padding: 20px; max-width: 500px; margin: auto; position: relative; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 24px; color: #94a3b8; }
        .stat-line { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #334155; }
    </style>
</head>
<body>

<div class="search-wrap">
    <input type="text" id="playerSearch" placeholder="🔍 Search All Players (Name, Team, Role)..." onkeyup="filterPlayers()">
</div>

<div id="pList" class="page active">
    <div id="playerResults"></div>
</div>

<div id="pAnalysis" class="page">
    <div class="card">
        <h3 style="color:var(--primary)">RD 7 MARKET TRENDS</h3>
        <p style="font-size:12px; margin-top:10px;">• <strong>Cash Cows:</strong> Anderson (-75 BE) and Tsatas (-49 BE) are mandatory.</p>
        <p style="font-size:12px; margin-top:5px;">• <strong>Value:</strong> Jordan Clark ($524k) and Luke Ryan ($468k) at bottom prices.</p>
    </div>
</div>

<div id="playerModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2 id="mName" style="color:var(--primary)"></h2>
        <p id="mTeam" style="font-size:12px; color:#94a3b8; margin-bottom:15px;"></p>
        
        <div class="stat-line"><span>PRICE</span><strong id="mPrice"></strong></div>
        <div class="stat-line"><span>BREAKEVEN</span><strong id="mBE"></strong></div>
        <div class="stat-line"><span>AVG SCORE</span><strong id="mAvg"></strong></div>
        <div class="stat-line"><span>LAST 3</span><strong id="mL3" style="color:var(--success)"></strong></div>
        <div class="stat-line"><span>CBA % (MID)</span><strong id="mCBA"></strong></div>
        
        <p style="margin-top:20px; font-size:11px; color:#94a3b8; line-height:1.4;"><strong>ANALYSIS:</strong> <span id="mNotes"></span></p>
    </div>
</div>

<nav>
    <button onclick="tab('pList')" class="active" id="bList">DATABASE</button>
    <button onclick="tab('pAnalysis')" id="bAnalysis">INSIGHTS</button>
</nav>

<script>
    // 📊 EXPANDED DATA PACK (Top RD7 Relevant Players)
    const players = [
        { name: "Angus Anderson", team: "Magpies", price: 113500, be: -75, avg: 72, l3: "68, 74, 75", cba: "65%", role: "Rookie", notes: "Mandatory cash cow. Highest ROI in Round 7." },
        { name: "Elijah Tsatas", team: "Bombers", price: 223400, be: -49, avg: 81, l3: "78, 85, 82", cba: "40%", role: "Mid-Price", notes: "Secured role on wing. Perfect price re-ignition play." },
        { name: "Isaac Heeney", team: "Swans", price: 632700, be: 24, avg: 121, l3: "115, 128, 0", cba: "0%", role: "Premium", notes: "OUT (Calf). Use trade simulator to pivot to Anderson." },
        { name: "Harry Sheezel", team: "Kangaroos", price: 645000, be: 112, avg: 124, l3: "141, 108, 123", cba: "15%", role: "Premium", notes: "TEST (Shoulder). High ceiling vs West Coast if cleared." },
        { name: "Jordan Clark", team: "Dockers", price: 524000, be: 61, avg: 105, l3: "88, 92, 146", cba: "0%", role: "Premium Def", notes: "Fallen premium. Massive value after recent price drop." },
        { name: "Nasiah Wanganeen-Milera", team: "Saints", price: 588300, be: 94, avg: 112, l3: "105, 118, 110", cba: "0%", role: "Elite Def", notes: "The #1 premium upgrade target for Round 7." },
        { name: "Nick Daicos", team: "Magpies", price: 685200, be: 108, avg: 128, l3: "135, 140, 112", cba: "78%", role: "Elite Mid", notes: "Captaincy favorite for ANZAC day clash." },
        { name: "Luke Ryan", team: "Dockers", price: 468400, be: 38, avg: 92, l3: "95, 102, 85", cba: "0%", role: "Value Def", notes: "Cheap entry for a former top-6 defender." },
        { name: "Zak Butters", team: "Power", price: 651000, be: 92, avg: 122, l3: "118, 154, 112", cba: "82%", role: "Elite Mid", notes: "Highest CBA participation at Port. Hold for season." }
    ];

    function filterPlayers() {
        const query = document.getElementById('playerSearch').value.toLowerCase();
        const results = players.filter(p => p.name.toLowerCase().includes(query) || p.team.toLowerCase().includes(query));
        renderList(results);
    }

    function renderList(list) {
        document.getElementById('playerResults').innerHTML = list.map(p => `
            <div class="player-card" onclick="openModal('${p.name}')">
                <div>
                    <strong>${p.name}</strong><br>
                    <small style="color:#94a3b8">${p.team} // ${p.role}</small>
                </div>
                <div class="price-tag">$${p.price.toLocaleString()}</div>
            </div>
        `).join('');
    }

    function openModal(name) {
        const p = players.find(x => x.name === name);
        document.getElementById('mName').innerText = p.name;
        document.getElementById('mTeam').innerText = p.team + " | " + p.role;
        document.getElementById('mPrice').innerText = "$" + p.price.toLocaleString();
        document.getElementById('mBE').innerText = p.be;
        document.getElementById('mAvg').innerText = p.avg;
        document.getElementById('mL3').innerText = p.l3;
        document.getElementById('mCBA').innerText = p.cba;
        document.getElementById('mNotes').innerText = p.notes;
        document.getElementById('playerModal').style.display = 'block';
    }

    function closeModal() { document.getElementById('playerModal').style.display = 'none'; }
    function tab(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('b' + id.substring(1)).classList.add('active');
    }

    window.onload = () => renderList(players);
</script>

</body>
</html>
