<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperCoach Analyst</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>SuperCoach Player Analyst</h1>
        <div class="controls">
            <input type="text" id="playerSearch" placeholder="Search name or team...">
            <select id="posFilter">
                <option value="ALL">All Positions</option>
                <option value="DEF">Defense</option>
                <option value="MID">Midfield</option>
                <option value="RUC">Ruck</option>
                <option value="FWD">Forward</option>
            </select>
        </div>
    </header>

    <main>
        <table id="playerTable">
            <thead>
                <tr>
                    <th>Player</th>
                    <th>Team</th>
                    <th>Pos</th>
                    <th>Price</th>
                    <th>Avg</th>
                    <th>Value</th>
                </tr>
            </thead>
            <tbody id="playerBody"></tbody>
        </table>
    </main>

    <script src="players.js"></script>
    <script src="app.js"></script>
</body>
</html>
