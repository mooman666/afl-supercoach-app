<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AFL Fantasy Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    header {
      position: sticky;
      top: 0;
      background: #111827;
      padding: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #2563eb;
      color: white;
    }

    button:hover {
      background: #1d4ed8;
    }

    #app {
      padding: 12px;
    }

    .card {
      background: #1f2937;
      padding: 12px;
      margin: 8px 0;
      border-radius: 10px;
    }

    .elite { border-left: 4px solid #22c55e; }
    .premium { border-left: 4px solid #3b82f6; }
    .value { border-left: 4px solid #f59e0b; }
    .avoid { border-left: 4px solid #ef4444; }

    .topbar {
      padding: 10px;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

<header>
  <button onclick="setFilter('ALL')">All</button>
  <button onclick="setFilter('MID')">MID</button>
  <button onclick="setFilter('DEF')">DEF</button>
  <button onclick="setFilter('FWD')">FWD</button>
  <button onclick="setFilter('RUC')">RUC</button>
</header>

<div id="app">Loading...</div>

<script src="app.js"></script>

</body>
</html>
