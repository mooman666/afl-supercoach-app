<!DOCTYPE html>
<html>
<head>
  <title>AFL App</title>
  <style>
    body { font-family: Arial; background:#0f172a; color:white; }
    .card { background:#1f2937; padding:10px; margin:10px; border-radius:8px; }
    button { margin:5px; padding:8px; }
  </style>
</head>

<body>

<h2>AFL Dashboard</h2>

<input placeholder="Search player..." oninput="setSearch(this.value)"/>

<button onclick="setMode('mid')">MID</button>
<button onclick="setMode('def')">DEF</button>
<button onclick="setMode('for')">FWD</button>
<button onclick="setMode('all')">ALL</button>

<div id="app"></div>

<script src="app.js"></script>

</body>
</html>
