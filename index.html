<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperCoach AI</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { margin:0; font-family:Arial; background:#0b0f14; color:white; }
header { padding:16px; text-align:center; background:linear-gradient(90deg,#00c46a,#00a3ff); font-weight:bold; }

.container { max-width:700px; margin:auto; padding:14px; }

.nav { display:flex; gap:6px; margin:12px 0; }
.nav button { flex:1; padding:10px; border:none; border-radius:10px; background:#1b1f2a; color:white; }

.card { background:#141a24; border:1px solid #243042; border-radius:14px; padding:14px; margin:12px 0; }

input { width:100%; padding:12px; border-radius:10px; border:1px solid #2a3445; background:#0e131c; color:white; }

button { width:100%; padding:12px; margin-top:10px; border:none; border-radius:10px; background:linear-gradient(90deg,#00c46a,#00a3ff); font-weight:bold; color:black; }

.section { display:none; }
.active { display:block; }

.small { font-size:12px; opacity:0.7; }
</style>
</head>

<body>

<header>
🏉 SuperCoach AI
<div class="small">Build v1.0.0</div>
</header>

<div class="container">

<div class="nav">
<button onclick="show('dashboard')">Dashboard</button>
<button onclick="show('analysis')">Analysis</button>
<button onclick="show('squad')">Squad</button>
<button onclick="show('trade')">Trade</button>
<button onclick="show('captain')">Captain</button>
</div>

<div id="dashboard" class="section active card">
<h3>Dashboard</h3>
<div id="kpis"></div>
<canvas id="chart"></canvas>
</div>

<div id="analysis" class="section card">
<h3>Analysis</h3>
<input id="player" placeholder="player">
<button onclick="analyse()">Run</button>
<p id="result"></p>
</div>

<div id="squad" class="section card">
<h3>Squad</h3>
<input id="squadInput">
<button onclick="addPlayer()">Add</button>
<div id="squadList"></div>
<p id="squadStats"></p>
</div>

<div id="trade" class="section card">
<h3>Trade</h3>
<input id="tradeInput">
<button onclick="trade()">Run</button>
<p id="tradeResult"></p>
</div>

<div id="captain" class="section card">
<h3>Captain</h3>
<button onclick="captain()">Find</button>
<p id="captainResult"></p>
</div>

</div>

<script src="players.js?v=1"></script>
<script src="app.js?v=1"></script>

</body>
</html>
