<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARCHITECT v28 // FULL LEAGUE ENGINE</title>
    <style>
        :root { --primary: #38bdf8; --success: #10b981; --danger: #ef4444; --warning: #f59e0b; --bg: #020617; --card: #1e293b; --nav: #0f172a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'JetBrains Mono', monospace; }
        body { background: var(--bg); color: #f1f5f9; padding-bottom: 90px; }

        /* Navigation */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--nav); display: flex; padding: 12px 0; border-top: 1px solid #334155; z-index: 1000; }
        .nav-item { color: #64748b; font-size: 10px; text-align: center; flex: 1; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: var(--primary); text-shadow: 0 0 10px var(--primary); }
        .nav-item i { display: block; font-size: 18px; margin-bottom: 4px; }

        /* UI Components */
        .screen { display: none; padding: 15px; animation: fadeIn 0.3s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .card { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #334155; }
        
        /* Search Hub */
        .search-container { position: sticky; top: 0; background: var(--bg); z-index: 100; padding: 10px 0; }
        #mainSearch { width: 100%; background: #0f172a; border: 1px solid var(--primary); padding: 14px; border-radius: 10px; color: white; outline: none; }
        
        /* Player Rows */
        .player-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #334155; cursor: pointer; }
        .p-team { font-size: 11px; color: #94a3b8; }
        .p-price { color: var(--success); font-weight: 800; }

        /* Trade Room */
        .trade-zone { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .trade-slot { border: 1px dashed #475569; padding: 15px; border-radius: 10px; text-align: center; background: #111827; min-height: 80px; display: flex; flex-direction: column; justify-content: center; }
        .trade-slot.active { border-color: var(--primary); background: #1e293b; }
        
        /* Live Section */
        .match-card { border-left: 4px solid var(--danger); }
    </style>
</head>
<body>

<div id="dash" class="screen active">
    <h2 style="margin-bottom:20px;">SYSTEM STATUS</h2>
    <div class="card">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div><small style="color:#94a3b8">SALARY CAP</small><br><strong>$18.30M</strong></div>
            <div><small style="color:#94a3b8">RD 7 DATA</small><br><strong style="color:var(--warning)">LIVE_FETCH</strong></div>
        </div>
    </div>
    <div class="card" id="marketStats"></div>
</div>

<div id="market" class="screen">
    <div class="search-container">
        <input type="text" id="mainSearch" placeholder="SEARCH ALL 18 TEAMS...">
    </div>
    <div id="marketList"></div>
</div>

<div id="live" class="screen">
    <h2 style="margin-bottom:15px;">LIVE ANZAC DAY</h2>
    <div class="card match-card">
        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <span><strong>ESS</strong> vs <strong>COL</strong></span>
            <span style="color:var(--danger); font-weight:bold;">LIVE Q2</span>
        </div>
        <div id="liveScores"></div>
    </div>
</div>

<div id="trade" class="screen">
    <h2>TRADE ARCHITECT</h2>
    <div class="trade-zone" style="margin-top:15px;">
        <div id="slotOut" class="trade-slot" onclick="startTrade('OUT')"><small>TAP TO REMOVE</small><br><strong>SELECT OUT</strong></div>
        <div id="slotIn" class="trade-slot" onclick="startTrade('IN')"><small>TAP TO ADD</small><br><strong>SELECT IN</strong></div>
    </div>
    <div id="tradeSummary" class="card" style="display:none; text-align:center;">
        <small>BANKED CASH</small><br>
        <strong id="banked" style="font-size:24px; color:var(--success)">$0</strong>
    </div>
</div>

<nav class="bottom-nav">
    <div class="nav-item active" onclick="nav('dash', this)"><i>📊</i>DASH</div>
    <div class="nav-item" onclick="nav('market', this)"><i>🔍</i>LIST</div>
    <div class="nav-item" onclick="nav('live', this)"><i>⚡</i>LIVE</div>
    <div class="nav-item" onclick="nav('trade', this)"><i>🔄</i>TRADE</div>
</nav>

<script>
    // --- FULL 18-TEAM LEAGUE REGISTRY ---
    const teams = ["ADL","BRI","CAR","COL","ESS","FRE","GEE","GCS","GWS","HAW","MEL","NTH","PTA","RIC","STK","SYD","WCE","WBD"];
    const roster = [
        { name: "Max Gawn", team: "MEL", pos: "RUC", price: 689600, be: 185, live: 112 },
        { name: "Nick Daicos", team: "COL", pos: "MID", price: 628400, be: 133, live: 94 },
        { name: "Zak Butters", team: "PTA", pos: "MID", price: 654800, be: 121, live: 0 },
        { name: "Harry Sheezel", team: "NTH", pos: "DEF/MID", price: 580400, be: 140, live: 122 },
        { name: "Angus Anderson", team: "COL", pos: "MID", price: 113500, be: -75, live: 88 },
        { name: "Jai Serong", team: "FRE", pos: "DEF", price: 276100, be: -37, live: 0 },
        { name: "Jagga Smith", team: "RIC", pos: "MID", price: 119900, be: -12, live: 0 },
        { name: "Elijah Tsatas", team: "ESS", pos: "MID", price: 223400, be: -49, live: 72 },
        { name: "Nasiah Wanganeen-Milera", team: "STK", pos: "DEF", price: 622300, be: 108, live: 0 },
        { name: "Tristan Xerri", team: "NTH", pos: "RUC", price: 687300, be: 125, live: 0 }
    ];

    // Generate simulated players for all 18 teams to ensure search works
    teams.forEach(t => {
        roster.push({ name: `${t} Premium`, team: t, pos: "MID", price: 620000, be: 110, live: 0 });
        roster.push({ name: `${t} Rookie`, team: t, pos: "FWD", price: 119900, be: -10, live: 0 });
    });

    let trade = { mode: null, out: null, in: null };

    function nav(id, el) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(el) el.classList.add('active');
    }

    function renderList(data) {
        document.getElementById('marketList').innerHTML = data.map(p => `
            <div class="player-row" onclick="pick('${p.name}')">
                <div><strong>${p.name}</strong><br><span class="p-team">${p.team} | ${p.pos}</span></div>
                <div style="text-align:right"><div class="p-price">$${p.price.toLocaleString()}</div><small>BE: ${p.be}</small></div>
            </div>
        `).join('');
    }

    function pick(name) {
        const p = roster.find(x => x.name === name);
        if (trade.mode) {
            if (trade.mode === 'OUT') trade.out = p;
            else trade.in = p;
            updateTrade();
            nav('trade', document.querySelectorAll('.nav-item')[3]);
        }
    }

    function startTrade(m) {
        trade.mode = m;
        nav('market', document.querySelectorAll('.nav-item')[1]);
        document.getElementById('mainSearch').placeholder = `SELECTING ${m}...`;
    }

    function updateTrade() {
        if (trade.out) document.getElementById('slotOut').innerHTML = `<strong>${trade.out.name}</strong><br>$${trade.out.price.toLocaleString()}`;
        if (trade.in) document.getElementById('slotIn').innerHTML = `<strong>${trade.in.name}</strong><br>$${trade.in.price.toLocaleString()}`;
        if (trade.out && trade.in) {
            document.getElementById('tradeSummary').style.display = 'block';
            document.getElementById('banked').innerText = "$" + (trade.out.price - trade.in.price).toLocaleString();
        }
        trade.mode = null;
    }

    document.getElementById('mainSearch').addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase();
        renderList(roster.filter(p => p.name.toLowerCase().includes(q) || p.team.toLowerCase().includes(q)));
    });

    window.onload = () => {
        renderList(roster);
        document.getElementById('liveScores').innerHTML = roster.filter(p => p.live > 0).map(p => `
            <div style="display:flex; justify-content:space-between; padding:8px 0;"><span>${p.name}</span><strong>${p.live}</strong></div>
        `).join('');
    };
</script>
</body>
</html>
