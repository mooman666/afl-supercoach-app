<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARCHITECT v16 // TOTAL DATABASE</title>
    <style>
        :root { --primary: #38bdf8; --success: #00ff88; --danger: #ef4444; --bg: #020617; --card: #1e293b; --nav: #0f172a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: #f1f5f9; padding-bottom: 90px; }

        /* SEARCH BAR */
        .search-container { background: var(--nav); padding: 15px; border-bottom: 2px solid var(--primary); position: sticky; top: 0; z-index: 1000; }
        #mainSearch { width: 100%; background: #111827; border: 2px solid #334155; padding: 16px; border-radius: 12px; color: white; font-size: 16px; outline: none; }

        /* LIST */
        .page { display: none; padding: 15px; }
        .page.active { display: block; }
        .player-row { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 10px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }

        /* MODAL */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; padding: 20px; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: var(--card); width: 100%; max-width: 450px; border-radius: 20px; padding: 25px; border: 1px solid var(--primary); }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .stat-box { background: #111827; padding: 10px; border-radius: 8px; text-align: center; }
        .stat-label { font-size: 9px; color: #94a3b8; text-transform: uppercase; }
        .stat-value { font-size: 16px; font-weight: 800; display: block; }

        nav { position: fixed; bottom: 0; width: 100%; display: flex; background: var(--nav); border-top: 1px solid #334155; padding: 15px; }
        nav button { flex: 1; background: none; border: none; color: #64748b; font-weight: 800; font-size: 11px; }
        nav button.active { color: var(--primary); }
    </style>
</head>
<body>

<div class="search-container">
    <input type="text" id="mainSearch" placeholder="🔍 Search Name, Team, or Position...">
</div>

<div id="dbPage" class="page active"><div id="listContainer"></div></div>
<div id="insightPage" class="page">
    <h2 style="color:var(--primary)">RD 7 STRATEGY</h2>
    <div style="margin-top:20px; padding:15px; background:rgba(0, 255, 136, 0.05); border:1px solid var(--success); border-radius:12px;">
        <strong>CASH COW PRIORITY:</strong> Angus Anderson is the #1 trade-in this week with a breakeven of -33.
    </div>
</div>

<div id="pModal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h2 id="mName" style="color:var(--primary)"></h2>
        <div id="mMeta" style="font-size:12px; color:#94a3b8; margin-bottom:10px;"></div>
        <div class="stat-grid">
            <div class="stat-box"><span class="stat-label">PRICE</span><span class="stat-value" id="mPrice" style="color:var(--success)"></span></div>
            <div class="stat-box"><span class="stat-label">BE</span><span class="stat-value" id="mBE"></span></div>
            <div class="stat-box"><span class="stat-label">AVG</span><span class="stat-value" id="mAvg"></span></div>
            <div class="stat-box"><span class="stat-label">OWN%</span><span class="stat-value" id="mOwn"></span></div>
        </div>
        <div style="background:#111827; padding:15px; border-radius:10px;">
            <span class="stat-label">LAST 3 ROUNDS</span>
            <div id="mHistory" style="font-weight:900; font-size:20px; color:var(--primary); letter-spacing:2px;"></div>
        </div>
        <p id="mNotes" style="font-size:13px; margin-top:20px; line-height:1.4; color:#cbd5e1;"></p>
    </div>
</div>

<nav>
    <button onclick="showTab('dbPage')" id="tabDb" class="active">DATABASE</button>
    <button onclick="showTab('insightPage')" id="tabIn">INSIGHTS</button>
</nav>

<script>
    // 🗃️ OFFICIAL ROUND 7 PRICES & DATA
    const database = [
        { name: "Max Gawn", team: "Melbourne", pos: "RUC", price: 1188000, be: 113, avg: 134, own: "58%", hist: "145, 128, 130", notes: "Top-tier ruck premium. Dominant scores vs Richmond on Friday." },
        { name: "Nick Daicos", team: "Collingwood", pos: "MID", price: 1134000, be: 108, avg: 128, own: "77%", hist: "135, 140, 112", notes: "Historically massive ANZAC Day performer. A safe captaincy play." },
        { name: "Nasiah Wanganeen-Milera", team: "St Kilda", pos: "DEF", price: 1163000, be: 110, avg: 112, own: "31%", hist: "105, 118, 110", notes: "The only pure defender priced in the elite bracket this year." },
        { name: "Harry Sheezel", team: "North Melbourne", pos: "MID/FWD", price: 1145000, be: 109, avg: 125, own: "99%", hist: "141, 108, 123", notes: "Tested finger during training. Expect high volume disposals vs GWS." },
        { name: "Zak Butters", team: "Port Adelaide", pos: "MID", price: 639800, be: 121, avg: 123, own: "96%", hist: "118, 154, 112", notes: "High CBA participation. Solid premium keeper." },
        { name: "Jordan Clark", team: "Fremantle", pos: "DEF", price: 524000, be: 61, avg: 105, own: "15%", hist: "88, 92, 146", notes: "Massive value after Round 6 masterclass (146 points)." },
        { name: "Angus Anderson", team: "Collingwood", pos: "MID", price: 113500, be: -33, avg: 79, own: "15%", hist: "68, 74, 95", notes: "Mandatory cash cow trade-in for Round 7." },
        { name: "Elijah Tsatas", team: "Essendon", pos: "MID", price: 223400, be: -49, avg: 91, own: "5%", hist: "88, 92, 94", notes: "Best mid-price value play on the wing." },
        { name: "Isaac Heeney", team: "Sydney", pos: "MID/FWD", price: 632700, be: 24, avg: 135, own: "10%", hist: "115, 128, 0", notes: "OUT (Calf). Massive sell priority for Round 7 bank generation." }
    ];

    // 🚀 THE FIX: Global Listener (Fires on every character typed)
    document.addEventListener('input', (e) => {
        if (e.target.id === 'mainSearch') {
            const query = e.target.value.toLowerCase();
            const filtered = database.filter(p => 
                p.name.toLowerCase().includes(query) || 
                p.team.toLowerCase().includes(query) ||
                p.pos.toLowerCase().includes(query)
            );
            render(filtered);
        }
    });

    function render(list) {
        const container = document.getElementById('listContainer');
        container.innerHTML = list.map(p => `
            <div class="player-row" onclick="openModal('${p.name}')">
                <div><strong>${p.name}</strong><br><small>${p.team} // ${p.pos}</small></div>
                <div style="text-align:right">
                    <div style="color:var(--success); font-weight:800">$${p.price.toLocaleString()}</div>
                    <small style="color:#94a3b8">B.E: ${p.be}</small>
                </div>
            </div>
        `).join('');
    }

    function openModal(name) {
        const p = database.find(x => x.name === name);
        if(!p) return;
        document.getElementById('mName').innerText = p.name;
        document.getElementById('mMeta').innerText = `${p.team} | ${p.pos}`;
        document.getElementById('mPrice').innerText = "$" + p.price.toLocaleString();
        document.getElementById('mBE').innerText = p.be;
        document.getElementById('mAvg').innerText = p.avg;
        document.getElementById('mOwn').innerText = p.own;
        document.getElementById('mHistory').innerText = p.hist;
        document.getElementById('mNotes').innerText = "ARCHITECT ANALYSIS: " + p.notes;
        document.getElementById('pModal').classList.add('active');
    }

    function closeModal() { document.getElementById('pModal').classList.remove('active'); }
    function showTab(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById(id === 'dbPage' ? 'tabDb' : 'tabIn').classList.add('active');
    }

    window.onload = () => render(database);
</script>
</body>
</html>
