<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFL SuperCoach Pro</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background: linear-gradient(180deg, #070707, #121212);
  color:white;
}

header {
  background: linear-gradient(90deg, #00c46a, #00a3ff);
  padding:18px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  letter-spacing:1px;
}

.container {
  padding:14px;
}

.nav {
  display:flex;
  gap:6px;
  margin-bottom:12px;
}

.nav button {
  flex:1;
  padding:12px;
  background:#1b1b1b;
  border:1px solid #2a2a2a;
  color:white;
  border-radius:10px;
}

.card {
  background: rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  margin:12px 0;
  padding:16px;
  border-radius:14px;
  backdrop-filter: blur(6px);
}

input {
  width:95%;
  padding:12px;
  border-radius:10px;
  border:1px solid #333;
  background:#0f0f0f;
  color:white;
}

button {
  width:100%;
  padding:12px;
  margin-top:10px;
  background: linear-gradient(90deg, #00c46a, #00a3ff);
  border:none;
  border-radius:10px;
  font-weight:bold;
  color:black;
}

ul { list-style:none; padding:0; }
li { padding:8px; border-bottom:1px solid #2a2a2a; }

.section { display:none; }
.active { display:block; }
</style>
</head>

<body>

<header>🏉 AFL SuperCoach Pro</header>

<div class="container">

<div class="nav">
<button onclick="show('analysis')">Analysis</button>
<button onclick="show('squad')">Squad</button>
<button onclick="show('trade')">Trades</button>
<button onclick="show('captain')">Captain</button>
<button onclick="show('news')">News</button>
</div>

<div id="analysis" class="section active card">
<h3>Player Analysis</h3>
<input id="player" placeholder="player name">
<button onclick="analyse()">Analyse</button>
<p id="result"></p>
</div>

<div id="squad" class="section card">
<h3>Squad Builder</h3>
<input id="squadInput" placeholder="add player">
<button onclick="addPlayer()">Add</button>
<ul id="squadList"></ul>
<p id="squadStats"></p>
</div>

<div id="trade" class="section card">
<h3>Trade Assistant</h3>
<input id="tradeInput" placeholder="player name">
<button onclick="trade()">Analyse Trade</button>
<p id="tradeResult"></p>
</div>

<div id="captain" class="section card">
<h3>Captain Optimiser</h3>
<button onclick="captain()">Find Best Captain</button>
<p id="captainResult"></p>
</div>

<div id="news" class="section card">
<h3>Insights</h3>
<div id="feed"></div>
</div>

</div>

<script src="players.js"></script>
<script src="app.js"></script>

</body>
</html>
