<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SC Terminal | Elite 2026</title>
    <style>
        /* 🌑 FORCED DARK THEME */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0b0f19; color: #f8fafc; font-family: sans-serif; }
        
        .ticker-wrap { background: #1e293b; color: #38bdf8; padding: 12px; font-weight: bold; border-bottom: 2px solid #38bdf8; }
        nav { display: flex; background: #161e2d; padding: 8px; gap: 8px; }
        nav button { flex: 1; background: #1e293b; border: 1px solid #38bdf8; color: #38bdf8; padding: 12px; border-radius: 6px; font-weight: bold; }

        .table-container { padding: 10px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; background: #161e2d; border-radius: 8px; }
        th { background: #1e293b; padding: 12px; text-align: left; color: #94a3b8; font-size: 10px; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #2d3748; font-size: 13px; }

        .be-tag { padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .buy { background: #00ff8822; color: #00ff88; border: 1px solid #00ff88; }
        .hold { background: #eab30822; color: #eab308; border: 1px solid #eab308; }
    </style>
</head>
<body>

<div class="ticker-wrap" id="newsTicker">WAITING FOR DATA...</div>

<nav>
    <button onclick="document.getElementById('dataTab').style.display='block'">📊 TERMINAL</button>
    <button onclick="alert('Insights Loading...')">✍️ INSIGHTS</button>
</nav>

<div id="dataTab" class="table-container">
    <table>
        <thead>
            <tr>
                <th>Player</th>
                <th>Price</th>
                <th>BE</th>
                <th>Run</th>
            </tr>
        </thead>
        <tbody id="playerBody">
            </tbody>
    </table>
</div>

<script src="players.js"></script>
<script>
    function render() {
        const body = document.getElementById('playerBody');
        if (typeof playerDatabase !== 'undefined') {
            body.innerHTML = playerDatabase.map(p => `
                <tr>
                    <td><strong>${p.name}</strong><br><small>${p.team}</small></td>
                    <td>$${p.price.toLocaleString()}</td>
                    <td><span class="be-tag ${p.be < 0 ? 'buy' : 'hold'}">${p.be}</span></td>
                    <td>${p.fixture ? p.fixture.join(' ') : 'TBD'}</td>
                </tr>
            `).join('');
            document.getElementById('newsTicker').innerHTML = newsUpdates.join(' | ');
        } else {
            body.innerHTML = "<tr><td colspan='4' style='text-align:center; padding:50px;'>Error: players.js not found. Check your file name in GitHub!</td></tr>";
        }
    }
    window.onload = render;
</script>
</body>
</html>
