<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFL SuperCoach AI</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin:0;
  font-family: Arial;
  background: radial-gradient(circle at top, #0f1722, #05070a);
  color:white;
}

header {
  background: linear-gradient(90deg, #00c46a, #00a3ff);
  padding:18px;
  text-align:center;
  font-size:18px;
  font-weight:bold;
}

.container {
  max-width:650px;
  margin:auto;
  padding:14px;
}

.card {
  background: rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:16px;
  padding:16px;
  margin:12px 0;
  backdrop-filter: blur(10px);
}

.nav {
  display:flex;
  gap:6px;
  margin:12px 0;
}

.nav button {
  flex:1;
  padding:10px;
  border-radius:10px;
  border:none;
  background:#1b1f2a;
  color:white;
}

input {
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:10px;
  border:1px solid #2a3445;
  background:#0e131c;
  color:white;
}

button {
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background: linear-gradient(90deg, #00c46a, #00a3ff);
  font-weight:bold;
  color:black;
}

.section { display:none; }
.active { display:block; }

img.hero {
  width:100%;
  border-radius:12px;
  margin-top:10px;
  opacity:0.9;
}

.small {
  font-size:12px;
  opacity:0.7;
}

canvas {
  margin-top:10px;
  background:#0b0f14;
  border-radius:12px;
  padding:10px;
}
</style>
</head>

<body>

<header>🏉 SuperCoach AI Dashboard</header>

<div class="container">

<!-- HERO GRAPHIC (AI IMAGE PLACEHOLDER) -->
<div class="card">
  <b>Live Intelligence Overview</b>
  <div class="small">AI-powered AFL analytics engine</div>
  <img class="hero" src="https://images.unsplash.com/photo-1511886929837-354d827aae26?auto=format&fit=crop&w=1000&q=60">
</div>

<div class="nav">
<button onclick="show('dashboard')">Dashboard</button>
<button onclick="show('analysis')">Analysis</button>
<button onclick="show('squad')">Squad</button>
<button onclick="show('trade')">Trades</button>
<button onclick="show('captain')">Captain</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="section active card">
<h3>Team Performance</h3>
<canvas id="teamChart"></canvas>
</div>

<!-- ANALYSIS -->
<div id="analysis" class="section card">
<h3>Player AI Analysis</h3>
<input id="player" placeholder="type player name">
<button onclick="analyse()">Analyse</button>
<p id="result"></p>
</div>

<!-- SQUAD -->
<div id="squad" class="section card">
<h3>Squad Builder</h3>
<input id="squadInput" placeholder="add player">
<button onclick="addPlayer()">Add</button>
<ul id="squadList"></ul>
<p id="squadStats"></p>
</div>

<!-- TRADE -->
<div id="trade" class="section card">
<h3>Trade Intelligence</h3>
<input id="tradeInput" placeholder="player">
<button onclick="trade()">Run AI Trade</button>
<p id="tradeResult"></p>
</div>

<!-- CAPTAIN -->
<div id="captain" class="section card">
<h3>Captain AI Selector</h3>
<button onclick="captain()">Find Best Captain</button>
<p id="captainResult"></p>
</div>

</div>

<script src="players.js"></script>
<script src="app.js"></script>

</body>
</html>
