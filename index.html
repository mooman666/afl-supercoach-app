<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARCHITECT v21 // TOTAL AFL REGISTRY</title>
    <style>
        :root { --primary: #38bdf8; --success: #00ff88; --danger: #ef4444; --bg: #020617; --card: #1e293b; --nav: #0f172a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: #f1f5f9; padding-bottom: 90px; }

        .search-container { background: var(--nav); padding: 15px; border-bottom: 2px solid var(--primary); position: sticky; top: 0; z-index: 1000; }
        #mainSearch { width: 100%; background: #111827; border: 2px solid #334155; padding: 16px; border-radius: 12px; color: white; font-size: 16px; outline: none; }

        .player-list { padding: 15px; }
        .player-row { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 10px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; padding: 20px; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: var(--card); width: 100%; max-width: 450px; border-radius: 20px; padding: 25px; border: 1px solid var(--primary); }
    </style>
</head>
<body>

<div class="search-container">
    <input type="text" id="mainSearch" placeholder="🔍 Search Name, Team, or Position...">
</div>

<div class="player-list" id="listContainer"></div>

<div id="pModal" class="modal" onclick="this.classList.remove('active')">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h2 id="mName" style="color:var(--primary)"></h2>
        <div id="mMeta" style="font-size:12px; color:#94a3b8; margin-bottom:10px;"></div>
        <div id="mPrice" style="margin: 20px 0; font-size: 28px; font-weight: 900; color: var(--success);"></div>
        <div id="mStats" style="background:#111827; padding:15px; border-radius:10px;"></div>
    </div>
</div>

<script>
    // 🗃️ 2026 MASTER DATA - ROUND 7 UPDATED
    const database = [
        // PREMIER $1M+ CLUB (Corrected 2026 Prices)
        { name: "Bailey Smith", team: "Cats", pos: "MID", price: 1220000, be: 116, avg: 116, own: "25%", hist: "120, 115, 114" },
        { name: "Max Gawn", team: "Demons", pos: "RUC", price: 1188000, be: 113, avg: 113, own: "58%", hist: "145, 128, 130" },
        { name: "Marcus Bontempelli", team: "Bulldogs", pos: "MID", price: 1167000, be: 111, avg: 111, own: "81%", hist: "125, 138, 127" },
        { name: "Nasiah Wanganeen-Milera", team: "Saints", pos: "DEF", price: 1163000, be: 110, avg: 110, own: "31%", hist: "105, 118, 110" },
        { name: "Harry Sheezel", team: "Kangaroos", pos: "MID/FWD", price: 1145000, be: 109, avg: 109, own: "99%", hist: "141, 108, 123" },
        { name: "Nick Daicos", team: "Magpies", pos: "MID", price: 1134000, be: 108, avg: 108, own: "77%", hist: "135, 140, 112" },
        { name: "Caleb Serong", team: "Dockers", pos: "MID", price: 1142000, be: 115, avg: 127, own: "45%", hist: "130, 124, 127" },
        { name: "Brodie Grundy", team: "Swans", pos: "RUC", price: 1122000, be: 107, avg: 107, own: "15%", hist: "125, 130, 111" },
        { name: "Tristan Xerri", team: "Kangaroos", pos: "RUC", price: 1101000, be: 105, avg: 105, own: "53%", hist: "132, 128, 135" },
        
        // POPULAR ROOKIES & MID-PRICE (2026 Prices)
        { name: "Zak Butters", team: "Power", pos: "MID", price: 1047000, be: 99, avg: 99, own: "96%", hist: "118, 154, 112" },
        { name: "Jagga Smith", team: "Blues", pos: "MID", price: 298700, be: -12, avg: 82, own: "75%", hist: "78, 85, 83" },
        { name: "Angus Anderson", team: "Magpies", pos: "MID", price: 113500, be: -33, avg: 79, own: "15%", hist: "68, 74, 95" },
        { name: "Jai Serong", team: "Swans", pos: "DEF/MID", price: 313300, be: 45, avg: 65, own: "26%", hist: "60, 72, 63" },
        { name: "Lachie Jaques", team: "Bulldogs", pos: "DEF", price: 250900, be: 15, avg: 58, own: "9%", hist: "55, 62, 57" }
    ];

    document.getElementById('mainSearch').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        const filtered = database.filter(p => 
            p.name.toLowerCase().includes(query) || 
            p.team.toLowerCase().includes(query) ||
            p.pos.toLowerCase().includes(query)
        );
        render(filtered);
    });

    function render(list) {
        document.getElementById('listContainer').innerHTML = list.map(p => `
            <div class="player-row" onclick="openModal('${p.name}')">
                <div><strong>${p.name}</strong><br><small>${p.team} | ${p.pos}</small></div>
                <div style="text-align:right">
                    <div style="color:var(--success); font-weight:800">$${p.price.toLocaleString()}</div>
                    <small style="color:#94a3b8">BE: ${p.be}</small>
                </div>
            </div>
        `).join('');
    }

    function openModal(name) {
        const p = database.find(x => x.name === name);
        document.getElementById('mName').innerText = p.name;
        document.getElementById('mMeta').innerText = `${p.team} | ${p.pos}`;
        document.getElementById('mPrice').innerText = "$" + p.price.toLocaleString();
        document.getElementById('mStats').innerHTML = `
            <strong>BE:</strong> ${p.be} &nbsp; | &nbsp; <strong>AVG:</strong> ${p.avg}<br>
            <strong>OWNERSHIP:</strong> ${p.own}<br>
            <strong>RECENT:</strong> ${p.hist}
        `;
        document.getElementById('pModal').classList.add('active');
    }

    window.onload = () => render(database);
</script>
</body>
</html>
