<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AFL SuperCoach App</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #0f172a;
      color: white;
    }

    header {
      padding: 15px;
      background: #111827;
      display: flex;
      gap: 10px;
    }

    button {
      padding: 10px;
      border: none;
      cursor: pointer;
      background: #2563eb;
      color: white;
      border-radius: 6px;
    }

    button:hover {
      background: #1d4ed8;
    }

    #app {
      padding: 15px;
    }

    .card {
      background: #1f2937;
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    h2 {
      margin-top: 10px;
    }
  </style>
</head>

<body>

<header>
  <button onclick="setView('rankings')">Rankings</button>
  <button onclick="setView('analytics')">Top 10</button>
</header>

<div id="app">
  Loading...
</div>

<script src="app.js"></script>

</body>
</html>
