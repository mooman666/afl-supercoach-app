<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFL SuperCoach Pro</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b0b0b;
  color:white;
}

header {
  background:#00c46a;
  padding:16px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

.container {
  padding:12px;
}

.card {
  background:#1a1a1a;
  margin:12px 0;
  padding:14px;
  border-radius:12px;
}

input {
  width:92%;
  padding:12px;
  margin:6px 0;
  border-radius:8px;
  border:none;
}

button {
  width:100%;
  padding:12px;
  margin-top:8px;
  background:#00c46a;
  border:none;
  border-radius:8px;
  font-weight:bold;
  color:black;
}
</style>
</head>

<body>

<header>🏉 AFL SuperCoach Pro</header>

<div class="container">

<div class="card">
<h3>Player Analysis</h3>
<input id="player" placeholder="neale, cripps, gawn">
<button onclick="analyse()">Analyse</button>
<p id="result"></p>
</div>

<div class="card">
<h3>Trade Assistant</h3>
<input id="tradeInput" placeholder="player name">
<button onclick="trade()">Get Advice</button>
<p id="tradeResult"></p>
</div>

</div>

<script src="players.js"></script>
<script src="app.js"></script>

</body>
</html>
