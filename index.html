<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AFL Fantasy Pro</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0f172a;
  color:white;
}

header {
  position:sticky;
  top:0;
  background:#111827;
  padding:10px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

button {
  padding:8px 10px;
  border:none;
  border-radius:6px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}

input {
  padding:8px;
  border-radius:6px;
  border:none;
  flex:1;
}

#app { padding:12px; }

.card {
  background:#1f2937;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
}

.elite { border-left:4px solid #22c55e; }
.premium { border-left:4px solid #3b82f6; }
.value { border-left:4px solid #f59e0b; }
.avoid { border-left:4px solid #ef4444; }

.insights {
  background:#111827;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
}
</style>
</head>

<body>

<header>
  <button onclick="setView('top')">Top</button>
  <button onclick="setView('value')">Value</button>
  <button onclick="setView('form')">Form</button>
  <input placeholder="Search..." oninput="setSearch(this.value)" />
</header>

<div id="app">Loading...</div>

<canvas id="chart" height="120"></canvas>

<script src="app.js"></script>

</body>
</html>
