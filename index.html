<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARCHITECT v14.1 // FIXED SEARCH</title>
    <style>
        :root { --primary: #38bdf8; --success: #00ff88; --danger: #ef4444; --bg: #020617; --card: #1e293b; --nav: #0f172a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: #f1f5f9; padding-bottom: 90px; }

        .search-container { background: var(--nav); padding: 15px; border-bottom: 2px solid var(--primary); position: sticky; top: 0; z-index: 1000; }
        /* Larger tap target for mobile */
        #mainSearch { width: 100%; background: #111827; border: 2px solid #334155; padding: 16px; border-radius: 12px; color: white; font-size: 16px; outline: none; transition: 0.3s; }
        #mainSearch:focus { border-color: var(--primary); }

        .page { display: none; padding: 15px; }
        .page.active { display: block; }
        .player-row { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 10px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; padding: 20px; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: var(--card); width: 100%; max-width: 450px; border-radius: 20px; padding: 25px; border: 1px solid var(--primary); }
        
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .stat-box { background: #111827; padding: 10px; border-radius: 8px; text-align: center; }
        .stat-value { font-size: 18px; font-weight: 800; display: block; }
        .stat-label { font-size: 9px; color: #94a3b8; text-transform: uppercase; }

        nav { position: fixed; bottom: 0; width: 100%; display: flex; background: var(--nav); border-top: 1px solid #334155; padding: 10px; }
        nav button { flex: 1; background: none; border: none; color: #64748b; font-weight: 800; font-size: 11px; padding: 10px; }
        nav button.active { color: var(--primary); }
    </style>
</head>
<body>

<div class="search-container">
    <input type="text" id="mainSearch" placeholder="🔍 Type name or team...">
</div>

<div id="dbPage" class="page active"><div id="listContainer"></div></div>
<div id="insightPage" class="page">
    <h2 style="color:var(--primary)">RD 7 INTEL</h2>
    <div style="margin-top:20px; padding:15px; background:rgba(239, 68, 68, 0.1); border-radius:10px; border-left:4px solid var(--danger);">
        <strong>HEENEY (OUT):</strong> Pivot to <strong>Angus Anderson</strong> or <strong>Elijah Tsatas</strong> to build $500k+ in bank.
    </div>
</div>

<div id="pModal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h2 id="mName" style="color:var(--primary)"></h2>
        <div id="mMeta" style="font-size:12px; color:#94a3b8; margin-bottom:10px;"></div>
        <div class="stat-grid">
            <div class="stat-box"><span class="stat-label">PRICE</span><span class="stat-value" id="mPrice" style="color:var(--success)"></span></div>
            <div class="stat-box"><span class="stat-label">BE</span><span class="stat-value" id="mBE"></span></div>
            <div class="stat-box"><span class="stat-label">AVG</span><span class="stat-value" id="mAvg"></span></div>
            <div class="stat-box"><span class="stat-label">OWN%</span><span class="stat-value" id="mOwn"></span></div>
        </div>
        <div style="background:#111827; padding:15px; border-radius:10px;">
            <span class="stat-label">LAST 3 SCORES</span>
            <div id="mHistory" style="font-weight:900; font-size:20px; color:var(--primary); letter-spacing:2px;"></div>
        </div>
        <p id="mNotes" style="font-size:13px; margin-top:20px; line-height:1.4; color:#cbd5e1;"></p>
    </div>
</div>

<nav>
    <button onclick="showTab('dbPage')" id="tabDb" class="active">TERMINAL</button>
    <button onclick="showTab('insightPage')" id="tabIn">INSIGHTS</button>
</nav>

<script>
    const database = [
        { name: "Max Gawn", team: "Demons", pos: "RUC", price: 651200, be: 115, avg: 134, own: "58.2%", hist: "145, 128, 130", notes: "Premier RUC. VC option for Friday. Richmond is vulnerable in the hitouts." },
        { name: "Brodie Grundy", team: "Swans", pos: "RUC", price: 628900, be: 98, avg: 133, own: "42.1%", hist: "135, 142, 122", notes: "In career-best form. Locking down the Swans midfield dominance." },
        { name: "Harry Sheezel", team: "Kangaroos", pos: "MID/FWD", price: 611700, be: 140, avg: 125, own: "99.7%", hist: "141, 108, 123", notes: "Sore finger/shoulder. Expect him to play but monitor final teams." },
        { name: "Angus Anderson", team: "Magpies", pos: "MID", price: 113500, be: -33, avg: 79, own: "15.7%", hist: "68, 74, 95", notes: "THE rookie of the week. Must-have for cash generation." },
        { name: "Nasiah Wanganeen-Milera", team: "Saints", pos: "DEF", price: 576600, be: 108, avg: 102, own: "31.4%", hist: "105, 118, 110", notes: "Elite ball user. Top defensive upgrade target for Rd 7." },
        { name: "Nick Daicos", team: "Magpies", pos: "MID", price: 634000, be: 133, avg: 122, own: "77.0%", hist: "135, 140, 112", notes: "Anzac Day specialist. Clear captaincy choice if you miss the VC loop." },
        { name: "Isaac Heeney", team: "Swans", pos: "MID/FWD", price: 632700, be: 24, avg: 135, own: "10.6%", hist: "115, 128, 0", notes: "OUT (Calf). Massive impact on team structures. Sell to fund upgrades." },
        { name: "Elijah Tsatas", team: "Bombers", pos: "MID", price: 223400, be: -49, avg: 91, own: "5.4%", hist: "88, 92, 94", notes: "High value mid-pricer. Averaging 90+ in his new wing role." }
    ];

    const searchInput = document.getElementById('mainSearch');
    const listContainer = document.getElementById('listContainer');

    // New, more reliable search listener
    searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        const filtered = database.filter(p => 
            p.name.toLowerCase().includes(query) || 
            p.team.toLowerCase().includes(query)
        );
        render(filtered);
    });

    function render(list) {
        listContainer.innerHTML = list.map(p => `
            <div class="player-row" onclick="openModal('${p.name}')">
                <div><strong>${p.name}</strong><br><small>${p.team} // ${p.pos}</small></div>
                <div style="text-align:right">
                    <div style="color:var(--success); font-weight:800">$${p.price.toLocaleString()}</div>
                    <small style="color:#94a3b8">BE: ${p.be}</small>
                </div>
            </div>
        `).join('');
    }

    function openModal(name) {
        const p = database.find(x => x.name === name);
        if(!p) return;
        document.getElementById('mName').innerText = p.name;
        document.getElementById('mMeta').innerText = `${p.team} | ${p.pos}`;
        document.getElementById('mPrice').innerText = "$" + p.price.toLocaleString();
        document.getElementById('mBE').innerText = p.be;
        document.getElementById('mAvg').innerText = p.avg;
        document.getElementById('mOwn').innerText = p.own;
        document.getElementById('mHistory').innerText = p.hist;
        document.getElementById('mNotes').innerText = "ARCHITECT ANALYSIS: " + p.notes;
        document.getElementById('pModal').classList.add('active');
    }

    function closeModal() { document.getElementById('pModal').classList.remove('active'); }

    function showTab(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById(id === 'dbPage' ? 'tabDb' : 'tabIn').classList.add('active');
    }

    // Initial load
    window.onload = () => render(database);
</script>
</body>
</html>
