<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFL SuperCoach AI</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b0b0b;
  color:white;
}

header {
  background:#00c46a;
  padding:16px;
  font-size:20px;
  font-weight:bold;
  text-align:center;
}

.container {
  padding:12px;
}

.card {
  background:#1a1a1a;
  margin:12px 0;
  padding:15px;
  border-radius:12px;
  border:1px solid #222;
}

input {
  width:92%;
  padding:12px;
  margin:6px 0;
  border-radius:8px;
  border:none;
}

button {
  width:100%;
  padding:12px;
  margin-top:8px;
  background:#00c46a;
  border:none;
  border-radius:8px;
  font-weight:bold;
}

ul {
  list-style:none;
  padding:0;
}

li {
  padding:8px;
  border-bottom:1px solid #333;
}

.tag {
  display:inline-block;
  padding:4px 8px;
  margin-top:6px;
  border-radius:6px;
  font-size:12px;
  background:#333;
}
</style>
</head>

<body>

<header>🏉 AFL SuperCoach AI</header>

<div class="container">

<div class="card">
<h3>Player Analysis</h3>
<input id="player" placeholder="neale, cripps, gawn">
<button onclick="analyse()">Analyse Player</button>
<p id="result"></p>
</div>

<div class="card">
<h3>Your Squad</h3>
<input id="squadInput" placeholder="add player">
<button onclick="addPlayer()">Add Player</button>
<ul id="squadList"></ul>
</div>

<div class="card">
<h3>Captain Compare</h3>
<input id="p1" placeholder="player 1">
<input id="p2" placeholder="player 2">
<button onclick="compare()">Compare</button>
<p id="compareResult"></p
