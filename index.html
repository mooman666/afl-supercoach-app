<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARCHITECT v14 // FULL REGISTRY</title>
    <style>
        :root { --primary: #38bdf8; --success: #00ff88; --danger: #ef4444; --bg: #020617; --card: #1e293b; --nav: #0f172a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: #f1f5f9; padding-bottom: 90px; }

        /* SEARCH BAR */
        .search-container { background: var(--nav); padding: 15px; border-bottom: 2px solid var(--primary); position: sticky; top: 0; z-index: 1000; }
        #mainSearch { width: 100%; background: #111827; border: 1px solid #334155; padding: 14px; border-radius: 12px; color: white; font-size: 16px; outline: none; }
        #mainSearch:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }

        /* LISTING */
        .page { display: none; padding: 15px; }
        .page.active { display: block; }
        .player-row { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 12px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .player-row:active { transform: scale(0.98); background: #2d3748; }
        .p-info strong { font-size: 16px; display: block; }
        .p-info small { color: #94a3b8; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
        .p-stats { text-align: right; }
        .p-price { color: var(--success); font-weight: 800; font-family: monospace; }
        .p-be { font-size: 12px; color: #94a3b8; }

        /* MODAL */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; padding: 20px; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: var(--card); width: 100%; max-width: 450px; border-radius: 20px; padding: 25px; position: relative; border: 1px solid var(--primary); }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 20px 0; }
        .stat-box { background: #111827; padding: 10px; border-radius: 8px; text-align: center; }
        .stat-label { font-size: 10px; color: #94a3b8; display: block; margin-bottom: 4px; }
        .stat-value { font-size: 18px; font-weight: 800; }

        /* FOOTER NAV */
        nav { position: fixed; bottom: 0; width: 100%; display: flex; background: var(--nav); border-top: 1px solid #334155; padding: 15px; }
        nav button { flex: 1; background: none; border: none; color: #64748b; font-weight: 800; font-size: 12px; cursor: pointer; }
        nav button.active { color: var(--primary); }
    </style>
</head>
<body>

<div class="search-container">
    <input type="text" id="mainSearch" placeholder="🔍 Find any player..." onkeyup="runSearch()">
</div>

<div id="dbPage" class="page active">
    <div id="listContainer"></div>
</div>

<div id="insightPage" class="page">
    <h2 style="color:var(--primary); margin-bottom:15px;">RD 7 CRITICAL INTEL</h2>
    <div style="background:var(--card); padding:15px; border-radius:12px; border-left: 4px solid var(--danger);">
        <strong>🚨 HEENEY ALERT:</strong> Isaac Heeney (Calf) is officially OUT for Rd 7. Tactical shift to mid-price rookies recommended.
    </div>
</div>

<div id="pModal" class="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h2 id="mName" style="color:var(--primary)"></h2>
        <span id="mMeta" style="font-size:12px; color:#94a3b8;"></span>
        
        <div class="stat-grid">
            <div class="stat-box"><span class="stat-label">PRICE</span><span class="stat-value" id="mPrice" style="color:var(--success)"></span></div>
            <div class="stat-box"><span class="stat-label">BREAKEVEN</span><span class="stat-value" id="mBE"></span></div>
            <div class="stat-box"><span class="stat-label">AVG</span><span class="stat-value" id="mAvg"></span></div>
            <div class="stat-box"><span class="stat-label">OWN %</span><span class="stat-value" id="mOwn"></span></div>
        </div>

        <div style="background:#111827; padding:15px; border-radius:10px;">
            <span class="stat-label">PAST 3 GAMES</span>
            <div id="mHistory" style="font-weight:bold; font-size:18px; letter-spacing:2px; color:var(--primary)"></div>
        </div>

        <div style="margin-top:20px;">
            <span class="stat-label">DEEP ANALYSIS</span>
            <p id="mNotes" style="font-size:13px; line-height:1.5; margin-top:5px;"></p>
        </div>
    </div>
</div>

<nav>
    <button onclick="showTab('dbPage')" id="tabDb" class="active">TERMINAL</button>
    <button onclick="showTab('insightPage')" id="tabIn">INSIGHTS</button>
</nav>

<script>
    // 🗃️ THE MASTER PLAYER REGISTRY (Add every player here)
    const database = [
        { name: "Harry Sheezel", team: "Kangaroos", pos: "MID/FWD", price: 611700, be: 140, avg: 125, own: "99.7%", hist: "141, 108, 123", notes: "Top priced forward. Testing a finger injury but high priority hold." },
        { name: "Zak Butters", team: "Power", pos: "MID", price: 639800, be: 121, avg: 123, own: "96.5%", hist: "118, 154, 112", notes: "Elite MID with 82% CBA participation. Season-long keeper." },
        { name: "Jai Serong", team: "Dockers", pos: "DEF", price: 276100, be: -37, avg: 76, own: "98.0%", hist: "72, 80, 76", notes: "The most owned defender. Massive cash generation still to come." },
        { name: "Nasiah Wanganeen-Milera", team: "Saints", pos: "DEF", price: 576600, be: 108, avg: 102, own: "31.4%", hist: "105, 118, 110", notes: "Primary target for defensive upgrades. High kick-to-handball ratio." },
        { name: "Isaac Heeney", team: "Swans", pos: "MID/FWD", price: 632700, be: 24, avg: 135, own: "10.6%", hist: "115, 128, 0", notes: "OUT (Calf). Pivoting to rookies like Anderson is the lead move for Rd 7." },
        { name: "Angus Anderson", team: "Magpies", pos: "MID", price: 113500, be: -33, avg: 79, own: "15.7%", hist: "68, 74, 95", notes: "Mandatory rookie trade-in. Negative breakeven ensures huge price jump." },
        { name: "Nick Daicos", team: "Magpies", pos: "MID", price: 634000, be: 133, avg: 122, own: "77.0%", hist: "135, 140, 112", notes: "Top-tier premium. High disposal volume makes him a safe captaincy loop." },
        { name: "Elijah Tsatas", team: "Bombers", pos: "MID", price: 223400, be: -49, avg: 91, own: "5.4%", hist: "88, 92, 94", notes: "Secured wing role. Best mid-price value currently available." },
        { name: "Marcus Bontempelli", team: "Bulldogs", pos: "MID", price: 699900, be: 179, avg: 130, own: "81.4%", hist: "125, 138, 127", notes: "Highest ceiling in the game. Expensive but worth every cent." }
        // You can now paste hundreds of rows here following the same format.
    ];

    function runSearch() {
        const query = document.getElementById('mainSearch').value.toLowerCase();
        const results = database.filter(p => 
            p.name.toLowerCase().includes(query) || 
            p.team.toLowerCase().includes(query) || 
            p.pos.toLowerCase().includes(query)
        );
        render(results);
    }

    function render(list) {
        const container = document.getElementById('listContainer');
        container.innerHTML = list.map(p => `
            <div class="player-row" onclick="openModal('${p.name}')">
                <div class="p-info">
                    <strong>${p.name}</strong>
                    <small>${p.team} // ${p.pos}</small>
                </div>
                <div class="p-stats">
                    <div class="p-price">$${p.price.toLocaleString()}</div>
                    <div class="p-be">B.E: ${p.be}</div>
                </div>
            </div>
        `).join('');
    }

    function openModal(name) {
        const p = database.find(x => x.name === name);
        document.getElementById('mName').innerText = p.name;
        document.getElementById('mMeta').innerText = `${p.team} | ${p.pos}`;
        document.getElementById('mPrice').innerText = "$" + p.price.toLocaleString();
        document.getElementById('mBE').innerText = p.be;
        document.getElementById('mAvg').innerText = p.avg;
        document.getElementById('mOwn').innerText = p.own;
        document.getElementById('mHistory').innerText = p.hist;
        document.getElementById('mNotes').innerText = p.notes;
        document.getElementById('pModal').classList.add('active');
    }

    function closeModal(e) { document.getElementById('pModal').classList.remove('active'); }

    function showTab(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        if(pageId === 'dbPage') document.getElementById('tabDb').classList.add('active');
        else document.getElementById('tabIn').classList.add('active');
    }

    window.onload = () => render(database);
</script>

</body>
</html>
