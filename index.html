<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperCoach AI Pro</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b0f14;
  color:white;
}

header {
  padding:18px;
  text-align:center;
  font-weight:bold;
  background:linear-gradient(90deg,#00c46a,#00a3ff);
}

/* LAYOUT */
.container {
  max-width:700px;
  margin:auto;
  padding:14px;
}

/* NAV FIXED */
.nav {
  display:flex;
  gap:6px;
  margin:12px 0;
}

.nav button {
  flex:1;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#1b1f2a;
  color:white;
}

/* CARDS */
.card {
  background:#141a24;
  border:1px solid #243042;
  border-radius:14px;
  padding:14px;
  margin:12px 0;
}

/* INPUT */
input {
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #2a3445;
  background:#0e131c;
  color:white;
}

/* BUTTON */
button {
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:linear-gradient(90deg,#00c46a,#00a3ff);
  font-weight:bold;
  color:black;
}

/* SECTIONS FIX */
.section { display:none; }
.active { display:block; }

/* KPI CARDS */
.kpiGrid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.kpi {
  background:#0e131c;
  padding:10px;
  border-radius:10px;
  border:1px solid #2a3445;
}

.rankCard {
  padding:10px;
  border-bottom:1px solid #2a3445;
}
</style>
</head>

<body>

<header>🏉 SuperCoach AI Dashboard</header>

<div class="container">

<div class="nav">
<button onclick="show('dashboard')">Dashboard</button>
<button onclick="show('analysis')">Analysis</button>
<button onclick="show('squad')">Squad</button>
<button onclick="show('trade')">Trade</button>
<button onclick="show('captain')">Captain</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="section active card">
<h3>📊 Team Overview</h3>

<div id="kpis" class="kpiGrid"></div>

<canvas id="chart"></canvas>
</div>

<!-- ANALYSIS -->
<div id="analysis" class="section card">
<h3>Player Analysis</h3>
<input id="player" placeholder="player name">
<button onclick="analyse()">Analyse</button>
<p id="result"></p>
</div>

<!-- SQUAD -->
<div id="squad" class="section card">
<h3>Squad Builder</h3>
<input id="squadInput" placeholder="add player">
<button onclick="addPlayer()">Add</button>
<div id="squadList"></div>
<p id="squadStats"></p>
</div>

<!-- TRADE -->
<div id="trade" class="section card">
<h3>Trade AI</h3>
<input id="tradeInput" placeholder="player">
<button onclick="trade()">Run</button>
<p id="tradeResult"></p>
</div>

<!-- CAPTAIN -->
<div id="captain" class="section card">
<h3>Captain Pick</h3>
<button onclick="captain()">Find Best Captain</button>
<p id="captainResult"></p>
</div>

</div>

<script src="players.js"></script>
<script src="app.js"></script>

</body>
</html>
