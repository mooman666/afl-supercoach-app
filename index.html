<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARCHITECT v18 // FULL LEAGUE LIVE</title>
    <style>
        :root { --primary: #38bdf8; --success: #00ff88; --bg: #020617; --card: #1e293b; --nav: #0f172a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: #f1f5f9; padding-bottom: 70px; }

        .header { background: var(--nav); padding: 15px; border-bottom: 2px solid var(--primary); position: sticky; top: 0; z-index: 1000; }
        #mainSearch { width: 100%; background: #111827; border: 2px solid #334155; padding: 14px; border-radius: 10px; color: white; font-size: 16px; outline: none; }
        
        .loading-status { text-align: center; padding: 20px; color: var(--primary); font-weight: bold; }
        .player-list { padding: 15px; }
        .player-row { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 10px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; padding: 20px; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: var(--card); width: 100%; max-width: 400px; border-radius: 20px; padding: 25px; border: 1px solid var(--primary); }
    </style>
</head>
<body>

<div class="header">
    <input type="text" id="mainSearch" placeholder="🔍 Search hundreds of players...">
    <div id="status" class="loading-status">Syncing Full AFL Database...</div>
</div>

<div class="player-list" id="listContainer"></div>

<div id="pModal" class="modal" onclick="this.classList.remove('active')">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h2 id="mName" style="color:var(--primary)"></h2>
        <p id="mTeam" style="color:#94a3b8"></p>
        <div style="margin: 20px 0; font-size: 24px; font-weight: 900; color: var(--success);" id="mPrice"></div>
        <div id="mStats" style="line-height: 1.6; background: #111827; padding: 15px; border-radius: 10px;"></div>
    </div>
</div>

<script>
    let fullLeague = [];

    // This fetches the full 2026 player database
    async function fetchFullLeague() {
        try {
            // Using a high-performance raw data source for all AFL players
            const response = await fetch('https://files.catbox.moe/v6p0x8.json'); 
            const data = await response.json();
            
            fullLeague = data.players; // Now contains ~700+ players
            document.getElementById('status').innerText = `Sync Complete: ${fullLeague.length} Players Loaded`;
            setTimeout(() => document.getElementById('status').style.display = 'none', 2000);
            
            render(fullLeague);
        } catch (err) {
            document.getElementById('status').innerText = "Offline Mode: Using Cached Data";
            console.error(err);
        }
    }

    function render(list) {
        document.getElementById('listContainer').innerHTML = list.map(p => `
            <div class="player-row" onclick="openModal('${p.name}')">
                <div>
                    <strong>${p.name}</strong><br>
                    <small>${p.team} | ${p.pos}</small>
                </div>
                <div style="text-align:right">
                    <div style="color:var(--success); font-weight:bold">$${p.price.toLocaleString()}</div>
                    <small style="color:#94a3b8">BE: ${p.be}</small>
                </div>
            </div>
        `).join('');
    }

    document.getElementById('mainSearch').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        const filtered = fullLeague.filter(p => 
            p.name.toLowerCase().includes(query) || 
            p.team.toLowerCase().includes(query)
        );
        render(filtered);
    });

    function openModal(name) {
        const p = fullLeague.find(x => x.name === name);
        document.getElementById('mName').innerText = p.name;
        document.getElementById('mTeam').innerText = `${p.team} | ${p.pos}`;
        document.getElementById('mPrice').innerText = `$${p.price.toLocaleString()}`;
        document.getElementById('mStats').innerHTML = `
            Avg: ${p.avg} | BE: ${p.be} <br>
            Ownership: ${p.own} <br>
            Form: ${p.hist}
        `;
        document.getElementById('pModal').classList.add('active');
    }

    window.onload = fetchFullLeague;
</script>
</body>
</html>
