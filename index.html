<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFL SuperCoach Pro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>🏉 AFL SuperCoach Pro</header>

<div class="container">

<div class="card">
<h3>Player Analysis</h3>
<input id="player" placeholder="neale, cripps, gawn">
<button onclick="analyse()">Analyse</button>
<p id="result"></p>
</div>

<div class="card">
<h3>Trade Assistant</h3>
<input id="tradeInput" placeholder="player name">
<button onclick="trade()">Get Advice</button>
<p id="tradeResult"></p>
</div>

</div>

<script src="players.js"></script>
<script src="app.js"></script>

</body>
</html>
