<style>
    .vcc-badge { font-size: 10px; font-weight: 800; color: #eab308; }
    .fix-chip { font-size: 9px; padding: 2px 4px; border-radius: 3px; background: #2d3748; color: #94a3b8; margin-right: 2px; border: 1px solid transparent; }
    .easy { color: #00ff88; border-color: #00ff8822; background: #00ff8811; }
    .hard { color: #ff4d4d; border-color: #ff4d4d22; background: #ff4d4d11; }
    .info-btn { background: none; border: 1px solid #38bdf8; color: #38bdf8; border-radius: 4px; font-size: 9px; padding: 2px 5px; cursor: pointer; }
</style>

<script>
function renderTable(data) {
    const body = document.getElementById('playerBody');
    body.innerHTML = data.map(p => {
        const beClass = p.be < 0 ? 'buy' : (p.be > 150 ? 'sell' : 'hold');
        
        // Generate Fixture Chips
        const fixHTML = p.fixture ? p.fixture.map(f => {
            const level = (f.includes('WCE') || f.includes('NMFC')) ? 'easy' : (f.includes('SYD') || f.includes('COL')) ? 'hard' : '';
            return `<span class="fix-chip ${level}">${f}</span>`;
        }).join('') : '';

        return `
            <tr>
                <td class="player-info">
                    <strong>${p.name}</strong>
                    <span class="vcc-badge">${p.vcc || ''}</span>
                </td>
                <td><span class="badge">${p.pos}</span></td>
                <td>$${p.price.toLocaleString()}</td>
                <td><div style="display:flex; flex-direction:column; gap:4px;">${fixHTML}</div></td>
                <td><span class="be-tag ${beClass}">${p.be}</span></td>
                <td><button class="info-btn" onclick="alert('${p.insight || 'Hold for Round 7'}')">VIEW</button></td>
            </tr>
        `;
    }).join('');
}
</script>
