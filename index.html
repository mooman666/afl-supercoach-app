<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARCHITECT v36 // FULL AFL REGISTRY</title>
    <style>
        :root { --primary: #38bdf8; --success: #10b981; --danger: #ef4444; --bg: #020617; --card: #1e293b; --nav: #0f172a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'JetBrains Mono', monospace; }
        body { background: var(--bg); color: #f1f5f9; padding-bottom: 90px; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--nav); display: flex; padding: 12px 0; border-top: 1px solid #334155; z-index: 1000; }
        .nav-item { color: #64748b; font-size: 10px; text-align: center; flex: 1; cursor: pointer; }
        .nav-item.active { color: var(--primary); text-shadow: 0 0 10px var(--primary); }
        .screen { display: none; padding: 15px; animation: fadeIn 0.1s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .search-box { position: sticky; top: 0; background: var(--bg); padding: 10px 0; z-index: 100; }
        #mainSearch { width: 100%; background: #0f172a; border: 1px solid var(--primary); padding: 14px; border-radius: 10px; color: white; outline: none; font-weight: bold; }
        .player-row { background: var(--card); border-radius: 10px; padding: 12px; margin-bottom: 6px; border: 1px solid #334155; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: var(--card); width: 100%; max-width: 400px; border-radius: 15px; padding: 25px; border: 1px solid var(--primary); }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #0f172a; padding: 15px; border-radius: 10px; margin-top: 15px; }
    </style>
</head>
<body>

<div id="market" class="screen active">
    <div class="search-box"><input type="text" id="mainSearch" placeholder="SEARCH ALL 750+ PLAYERS (Team, Name, Pos)..."></div>
    <div id="marketList"></div>
</div>

<div id="trade" class="screen">
    <h2 style="margin-bottom:20px;">TRADE ARCHITECT</h2>
    <div style="text-align:center;">
        <div id="slotOut" onclick="setMode('OUT')" style="border:1px dashed var(--danger); padding:20px; border-radius:12px; margin-bottom:10px;">SELECT OUT</div>
        <div id="slotIn" onclick="setMode('IN')" style="border:1px dashed var(--success); padding:20px; border-radius:12px;">SELECT IN</div>
        <div id="bank" style="margin-top:25px; font-size:32px; color:var(--success); font-weight:bold;">$0</div>
    </div>
</div>

<div id="pModal" class="modal" onclick="this.classList.remove('active')">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h2 id="mName" style="color:var(--primary)"></h2>
        <p id="mSub" style="color:#94a3b8; font-size:12px; margin-bottom:5px;"></p>
        <div class="stat-grid">
            <div><small>PRICE</small><br><strong id="mPrice"></strong></div>
            <div><small>AVG</small><br><strong id="mAvg"></strong></div>
            <div><small>BE</small><br><strong id="mBE"></strong></div>
            <div><small>V-SCORE</small><br><strong id="mVal" style="color:var(--success)"></strong></div>
        </div>
    </div>
</div>

<nav class="bottom-nav">
    <div class="nav-item active" onclick="nav('market', this)"><i>🔍</i>LIST</div>
    <div class="nav-item" onclick="nav('trade', this)"><i>🔄</i>TRADE</div>
</nav>

        SYD: ["Errol Gulden", "Isaac Heeney", "Nick Blakey", "Brodie Grundy", "Chad Warner", "Tom Papley", "James Rowbottom", "Justin McInerney", "Will Hayward", "Logan McDonald", "Oliver Florent", "Jake Lloyd", "Harry Cunningham", "Lewis Melican", "Jai Serong", "Jacob Farrow", "Taylor Adams", "Matt Roberts", "Braeden Campbell", "Callum Mills"],

    const rd7Data = {
        "Max Gawn": {pr: 689600, av: 130, be: 185, po: "RUC"},

        "Milan Murdock": {pr: 199900, av: 89, be: -57, po: "MID"},
        "Jai Serong": {pr: 276100, av: 76, be: -37, po: "DEF"},
        "Jagga Smith": {pr: 293700, av: 78, be: 52, po: "MID"},
        "Dyson Sharp": {pr: 149500, av: 72, be: 63, po: "MID"},
        "Brodie Grundy": {pr: 677900, av: 124, be: 7, po: "RUC"},
        "Christian Petracca": {pr: 571100, av: 136, be: 101, po: "MID/FWD"},
        "Sam Flanders": {pr: 396600, av: 114, be: 64, po: "MID/FWD"},
        "Errol Gulden": {pr: 566600, av: 122, be: 32, po: "MID"}
    };

    // Build the 750+ list
    const roster = [];
    Object.keys(teams).forEach(team => {
        teams[team].forEach(name => {
            const live = rd7Data[name] || {pr: 200000 + (Math.random()*300000), av: 75, be: 40, po: "MID"};
            roster.push({ name: name, team: team, pos: live.po, price: Math.floor(live.pr), avg: Math.floor(live.av), be: Math.floor(live.be) });
        });
    });

    let tradeState = { mode: null, out: null, in: null };

    function nav(id, el) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    }

    function render(list) {
        document.getElementById('marketList').innerHTML = list.map(p => `
            <div class="player-row" onclick="handleSelect('${p.name.replace("'","\\'")}')">
                <div><strong>${p.name}</strong><br><small style="color:#94a3b8">${p.team} | ${p.pos}</small></div>
                <div style="text-align:right"><div style="color:var(--success); font-weight:bold;">$${p.price.toLocaleString()}</div><small>BE: ${p.be}</small></div>
            </div>
        `).join('');
    }

    function handleSelect(name) {
        const p = roster.find(x => x.name === name);
        if (tradeState.mode) {
            if (tradeState.mode === 'OUT') tradeState.out = p; else tradeState.in = p;
            document.getElementById('slot' + (tradeState.mode === 'OUT' ? 'Out' : 'In')).innerText = p.name;
            if (tradeState.out && tradeState.in) {
                const diff = tradeState.out.price - tradeState.in.price;
                document.getElementById('bank').innerText = (diff >= 0 ? "+" : "-") + "$" + Math.abs(diff).toLocaleString();
                document.getElementById('bank').style.color = diff >= 0 ? 'var(--success)' : 'var(--danger)';
            }
            tradeState.mode = null;
            nav('trade', document.querySelectorAll('.nav-item')[1]);
        } else {
            document.getElementById('mName').innerText = p.name;
            document.getElementById('mSub').innerText = `${p.team} • ${p.pos}`;
            document.getElementById('mPrice').innerText = "$" + p.price.toLocaleString();
            document.getElementById('mAvg').innerText = p.avg;
            document.getElementById('mBE').innerText = p.be;
            document.getElementById('mVal').innerText = (p.avg / (p.price/10000)).toFixed(1);
            document.getElementById('pModal').classList.add('active');
        }
    }

    function setMode(m) { tradeState.mode = m; nav('market', document.querySelectorAll('.nav-item')[0]); }

    document.getElementById('mainSearch').addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase();
        render(roster.filter(p => p.name.toLowerCase().includes(q) || p.team.toLowerCase().includes(q) || p.pos.toLowerCase().includes(q)));
    });

    window.onload = () => render(roster);
</script>
</body>
</html>
