<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperCoach Elite Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ticker-wrap" id="newsTicker"></div>

    <nav>
        <button onclick="showTab('dataTab')">📊 Player Data</button>
        <button onclick="showTab('articleTab')">✍️ Analysis Articles</button>
    </nav>

    <div id="dataTab" class="tab-content">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Player</th><th>Pos</th><th>Price</th><th>Avg</th><th>CBA%</th><th>TOG%</th><th>BE</th>
                    </tr>
                </thead>
                <tbody id="playerBody"></tbody>
            </table>
        </div>
    </div>

    <div id="articleTab" class="tab-content" style="display:none;">
        <div class="article-grid" id="articleGrid"></div>
    </div>

    <script src="players.js?v=4"></script>
    <script src="app.js?v=4"></script>
</body>
</html>
