<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFL SuperCoach AI</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b0b0b;
  color:white;
}

header {
  background:#00c46a;
  padding:16px;
  font-size:20px;
  font-weight:bold;
  text-align:center;
}

.container {
  padding:12px;
}

.card {
  background:#1a1a1a;
  margin:12px 0;
  padding:15px;
  border-radius:12px;
  border:1px solid #222;
}

h3 {
  margin-top:0;
}

input {
  width:92%;
  padding:12px;
  margin:6px 0;
  border-radius:8px;
  border:none;
}

button {
  width:100%;
  padding:12px;
  margin-top:8px;
  background:#00c46a;
  border:none;
  border-radius:8px;
  font-weight:bold;
}

ul {
  list-style:none;
  padding:0;
}

li {
  padding:6px 0;
  border-bottom:1px solid #333;
}

.tag {
  display:inline-block;
  padding:4px 8px;
  margin-top:6px;
  border-radius:6px;
  font-size:12px;
  background:#333;
}
</style>
</head>

<body>

<header>🏉 AFL SuperCoach AI Dashboard</header>

<div class="container">

<!-- PLAYER ANALYSIS -->
<div class="card">
<h3>Player Analysis</h3>
<input id="player" placeholder="neale, cripps, gawn">
<button onclick="analyse()">Analyse Player</button>
<p id="result"></p>
</div>

<!-- SQUAD -->
<div class="card">
<h3>Your Squad</h3>
<input id="squadInput" placeholder="add player">
<button onclick="addPlayer()">Add Player</button>
<ul id="squadList"></ul>
</div>

<!-- CAPTAIN COMPARE -->
<div class="card">
<h3>Captain Compare</h3>
<input id="p1" placeholder="player 1">
<input id="p2" placeholder="player 2">
<button onclick="compare()">Compare</button>
<p id="compareResult"></p>
</div>

</div>

<script>

// ---------------- DATA ----------------
const players = {
  neale: 121,
  cripps: 115,
  gawn: 108,
  brayshaw: 112,
  serong: 110,
  bontempelli: 118,
  dawson: 109,
  rowell: 106,
  mills: 111
};

let squad = [];

// ---------------- ANALYSE ----------------
function analyse() {
  let p = document.getElementById("player").value.toLowerCase();

  if (!players[p]) {
    document.getElementById("result").innerHTML = "❌ No data found";
    return;
  }

  let score = players[p];
  let tag = "";

  if (score >= 120) tag = "🔥 ELITE CAPTAIN";
  else if (score >= 110) tag = "📈 PREMIUM PICK";
  else if (score < 100) tag = "⚠️ TRADE OUT";
  else tag = "✔ SOLID OPTION";

  document.getElementById("result").innerHTML =
    `<b>${p.toUpperCase()}</b><br>
    Avg: ${score}<br>
    <span class="tag">${tag}</span>`;
}

// ---------------- SQUAD ----------------
function addPlayer() {
  let p = document.getElementById("squadInput").value.toLowerCase();
  if (!p) return;

  squad.push(p);
  renderSquad();
}

function renderSquad() {
  let list = document.getElementById("squadList");
  list.innerHTML = "";

  squad.forEach(p => {
    let li = document.createElement("li");
    li.textContent = "🏉 " + p.toUpperCase();
    list.appendChild(li);
  });
}

// ---------------- COMPARE ----------------
function compare() {
  let a = document.getElementById("p1").value.toLowerCase();
  let b = document.getElementById("p2").value.toLowerCase();

  if (!players[a] || !players[b]) {
    document.getElementById("compareResult").innerText = "Player not found";
    return;
  }

  let winner = players[a] > players[b] ? a : b;

  document.getElementById("compareResult").innerHTML =
    `${a.toUpperCase()}: ${players[a]}<br>
     ${b.toUpperCase()}: ${players[b]}<br><br>
     🏆 Best Captain: <b>${winner.toUpperCase()}</b>`;
}

</script>

</body>
</html>
