<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperCoach Pro Analyst</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>SuperCoach Pro Analyst 2026</h1>
        <div class="controls">
            <input type="text" id="playerSearch" placeholder="Search Player...">
            <select id="posFilter">
                <option value="ALL">All Positions</option>
                <option value="DEF">Defense</option>
                <option value="MID">Midfield</option>
                <option value="RUC">Ruck</option>
                <option value="FWD">Forward</option>
            </select>
            <select id="teamFilter">
                <option value="ALL">All Teams</option>
                <option value="Crows">Crows</option>
                <option value="Magpies">Magpies</option>
                <option value="Demons">Demons</option>
                <option value="Swans">Swans</option>
                <option value="Kangaroos">Kangaroos</option>
                <option value="Power">Power</option>
                <option value="Dockers">Dockers</option>
            </select>
        </div>
    </header>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th onclick="handleSort('name')">Player</th>
                    <th onclick="handleSort('team')">Team</th>
                    <th onclick="handleSort('pos')">Pos</th>
                    <th onclick="handleSort('price')">Price</th>
                    <th onclick="handleSort('avg')">Avg</th>
                    <th onclick="handleSort('value')">Value</th>
                    <th onclick="handleSort('bye')">Bye</th>
                </tr>
            </thead>
            <tbody id="playerBody"></tbody>
        </table>
    </div>

    <script src="players.js"></script>
    <script src="app.js"></script>
</body>
</html>
