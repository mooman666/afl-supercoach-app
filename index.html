<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SC Terminal | OMNI v3.0</title>
    <style>
        :root { --neon-blue: #38bdf8; --neon-green: #00ff88; --dark-bg: #030712; --card-bg: #111827; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--dark-bg); color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; padding-bottom: 100px; }
        
        /* 🛰️ ANALYTICS HEADER */
        .header { background: #161e2d; padding: 20px; border-bottom: 1px solid var(--neon-blue); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .glitch-text { font-size: 14px; font-weight: 900; letter-spacing: 2px; color: var(--neon-blue); text-transform: uppercase; }

        /* 📟 TABS SYSTEM */
        nav { display: flex; background: #161e2d; padding: 10px; gap: 5px; position: fixed; bottom: 0; width: 100%; z-index: 1000; border-top: 1px solid #1f2937; }
        nav button { flex: 1; background: transparent; border: none; color: #94a3b8; padding: 15px 5px; font-size: 9px; font-weight: 800; text-transform: uppercase; transition: 0.3s; }
        nav button.active { color: var(--neon-blue); border-top: 3px solid var(--neon-blue); background: #38bdf80a; }

        .page { display: none; padding: 15px; }
        .page.active { display: block; }

        /* 🃏 DATA CARDS */
        .card { background: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 10px; border: 1px solid #1f2937; position: relative; }
        .card.hot { border-left: 4px solid var(--neon-green); }
        .card.cold { border-left: 4px solid #ef4444; }

        .stat-row { display: flex; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px solid #374151; }
        .stat-box { text-align: center; flex: 1; }
        .label { font-size: 9px; color: #94a3b8; display: block; margin-bottom: 2px; }
        .val { font-size: 13px; font-weight: bold; }

        /* 👑 CAPTAINCY LOOPHOLE ENGINE */
        .loophole-box { background: #1e293b; padding: 15px; border-radius: 12px; border: 1px solid var(--neon-blue); }
        .status-light { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
        
        /* ✍️ STRATEGY HUB */
        .article { background: #1f2937; border-radius: 8px; padding: 15px; margin-bottom: 10px; line-height: 1.5; }
        .article h4 { color: var(--neon-blue); margin-bottom: 8px; }
    </style>
</head>
<body>

<div class="header">
    <div class="glitch-text">TERMINAL // OMNI</div>
    <div style="font-size: 10px; color: var(--neon-green);">● LIVE FEED SYNCED</div>
</div>

<div id="pageTerminal" class="page active">
    <div id="terminalList"></div>
</div>

<div id="pageStrategy" class="page">
    <h3 style="margin-bottom:15px; border-left: 4px solid var(--neon-blue); padding-left: 10px;">PRO STRATEGY // R7</h3>
    <div id="strategyList"></div>
</div>

<div id="pageLoop" class="page">
    <h3>👑 Loophole Analyzer</h3>
    <div class="loophole-box">
        <p style="font-size:12px; margin-bottom:15px;">Target Score to take VC: <strong style="color:var(--neon-green);">125+</strong></p>
        <div id="loopResults"></div>
    </div>
</div>

<div id="pagePlanner" class="page">
    <div class="card">
        <label class="label">OUT: PEAKED ASSET</label>
        <select id="sOut" onchange="calc()" style="width:100%; padding:12px; background:#0f172a; color:#fff; border:1px solid #334155; border-radius:8px;"></select>
        <div style="height:15px;"></div>
        <label class="label">IN: UPGRADE TARGET</label>
        <select id="sIn" onchange="calc()" style="width:100%; padding:12px; background:#0f172a; color:#fff; border:1px solid #334155; border-radius:8px;"></select>
    </div>
    <div style="text-align:center; padding:30px; background: #00ff8808; border: 1px dashed var(--neon-green); border-radius: 12px;">
        <span class="label">PROJECTED BANK IMPACT</span>
        <div id="bankVal" style="font-size:32px; font-weight:900; color:var(--neon-green);">$0</div>
    </div>
</div>

<nav>
    <button onclick="nav('pageTerminal')" class="active">TERMINAL</button>
    <button onclick="nav('pageStrategy')">STRATEGY</button>
    <button onclick="nav('pageLoop')">LOOP</button>
    <button onclick="nav('pagePlanner')">PLANNER</button>
</nav>

<script src="players.js"></script>
<script>
    function nav(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function init() {
        if (typeof playerDatabase === 'undefined') return;
        
        // Terminal List
        document.getElementById('terminalList').innerHTML = playerDatabase.map(p => `
            <div class="card ${p.be < 50 ? 'hot' : 'cold'}">
                <div style="display:flex; justify-content:space-between;">
                    <div><strong>${p.name}</strong><br><small style="color:#94a3b8;">${p.team} // ${p.pos}</small></div>
                    <div style="text-align:right;"><span style="color:var(--neon-blue); font-weight:900;">$${p.price.toLocaleString()}</span><br><span style="font-size:10px; color:${p.be < 50 ? 'var(--neon-green)' : '#ef4444'}">BE: ${p.be}</span></div>
                </div>
                <div class="stat-row">
                    <div class="stat-box"><span class="label">PROJ</span><span class="val">${p.proj}</span></div>
                    <div class="stat-box"><span class="label">VAL</span><span class="val">${p.val}</span></div>
                    <div class="stat-box"><span class="label">OWN%</span><span class="val">${p.own}</span></div>
                </div>
            </div>
        `).join('');

        // Strategy Articles
        document.getElementById('strategyList').innerHTML = articles.map(a => `
            <div class="article"><h4>${a.title}</h4><p style="font-size:12px; color:#cbd5e1;">${a.content}</p></div>
        `).join('');

        // Loophole Logic
        document.getElementById('loopResults').innerHTML = playerDatabase.filter(p => p.vcc).map(p => `
            <div style="padding:10px 0; border-bottom:1px solid #334155;">
                <span style="font-weight:bold;">${p.name} (${p.vcc})</span>
                <span style="float:right; color:var(--neon-blue); font-weight:bold;">PROJ: ${p.proj}</span>
            </div>
        `).join('');

        // Planner
        const sOut = document.getElementById('sOut');
        const sIn = document.getElementById('sIn');
        const opts = playerDatabase.sort((a,b)=>a.name.localeCompare(b.name)).map(p => `<option value="${p.price}">${p.name} ($${p.price.toLocaleString()})</option>`).join('');
        sOut.innerHTML = `<option value="0">Select Asset</option>` + opts;
        sIn.innerHTML = `<option value="0">Select Target</option>` + opts;
    }

    function calc() {
        const diff = document.getElementById('sOut').value - document.getElementById('sIn').value;
        const res = document.getElementById('bankVal');
        res.innerText = (diff >= 0 ? "+" : "") + "$" + diff.toLocaleString();
        res.style.color = diff >= 0 ? "var(--neon-green)" : "#ef4444";
    }

    window.onload = init;
</script>
</body>
</html>
